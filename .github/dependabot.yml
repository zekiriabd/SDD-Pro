# Dependabot v2 — SDD_Pro supply-chain bump automation
#
# v7.0.1 audit P1 v2 (2026-06-08) — added to mitigate the supply-chain risk
# identified by the security audit : `pip install -e .claude/python[dev]`
# used `>=` deps that would silently install a malicious release of pytest,
# pytest-xdist, twine, or build.
#
# Dependabot reviews 3 ecosystems weekly :
#   1. Python (pyproject.toml) — sdd-pro-tools dev/build deps
#   2. npm (workspace/console/package.json) — console web (@anthropic-ai/sdk,
#      fastify, esbuild, etc.) — particulièrement critique pour
#      node-fetch transitif CVE
#   3. GitHub Actions (.github/workflows/) — actions/checkout, setup-python, etc.
#
# Review SLA :
#   - patch  : auto-merge OK après CI green (no breaking)
#   - minor  : reviewer approval required (potential API drift)
#   - major  : reviewer approval + audit changelog (breaking by definition)

version: 2

updates:
  # ─── Python deps ──────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/.claude/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    reviewers:
      - "zekir"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(python)"
      include: "scope"
    # Group patch updates together to reduce PR noise
    groups:
      python-dev-patches:
        patterns:
          - "pytest*"
        update-types:
          - "patch"

  # ─── npm deps (console web) ──────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/workspace/console"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    reviewers:
      - "zekir"
    labels:
      - "dependencies"
      - "console"
    commit-message:
      prefix: "deps(console)"
      include: "scope"
    # Priority bump for @anthropic-ai/sdk + transitive (node-fetch CVE)
    groups:
      anthropic-sdk:
        patterns:
          - "@anthropic-ai/*"
      console-runtime:
        patterns:
          - "fastify*"
          - "esbuild"
        update-types:
          - "patch"
          - "minor"

  # ─── GitHub Actions ──────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    reviewers:
      - "zekir"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(ci)"
      include: "scope"
