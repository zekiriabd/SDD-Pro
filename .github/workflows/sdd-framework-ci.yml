name: SDD_Pro Framework CI

# Lightweight CI for SDD_Pro framework — runs pytest + framework_smoke +
# strict validators. Keeps the framework healthy across contributions.
#
# Generated by `corrige le tout` audit session (2026-05-21). Adjust the
# trigger paths to your branch policy.

on:
  push:
    branches: [main, next]
    paths:
      - ".claude/**"
      - ".github/workflows/sdd-framework-ci.yml"
  pull_request:
    paths:
      - ".claude/**"

jobs:
  framework-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
      # Strict mode for hooks during CI : preflight_agent_budget and
      # protect_framework auto-detect CI and switch to deny-on-violation.
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        working-directory: .claude/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ---------------------------------------------------------------
      # Tier 1 : determinisitic checks (zero LLM, < 30 s)
      # ---------------------------------------------------------------
      - name: pytest (Python tooling)
        working-directory: .claude/python
        run: pytest --tb=short -q

      - name: Framework smoke
        run: |
          python .claude/python/sdd_admin/framework_smoke.py --strict

      # ---------------------------------------------------------------
      # Tier 2 : strict validators (catch typos + drift early)
      # ---------------------------------------------------------------
      - name: Validate inline rules drift
        run: |
          python .claude/python/sdd_scripts/validate_inline_rules.py --strict

      - name: Validate Project Config schema
        run: |
          python .claude/python/sdd_scripts/validate_project_config.py --strict-unknown

      - name: Validate libs catalogs
        run: |
          python .claude/python/sdd_admin/validate_libs_catalog.py

      - name: Validate stack .md headers (Status: + Validation:)
        run: |
          python .claude/python/sdd_admin/validate_stack_md_headers.py --strict
