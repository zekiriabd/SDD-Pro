# SDD_Pro — Framework CI
#
# Validates the framework on every push/PR. Does NOT run /sdd-full
# (that requires LLM credits + ~$15-30/run). Static-only checks:
#   1. Framework smoke (zero hardcoded exit codes, schema, etc.)
#   2. pytest (1067 tests in <30s)
#   3. Bootstrap auto-init dry-run on all combos
#   4. libs-catalog schema validation
#   5. Lint (ruff)
#
# See .claude/docs/cookbook.md for getting started.

name: SDD_Pro CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:

jobs:
  framework-validation:
    name: Framework smoke + tests + lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SDD_Pro Python tools
        run: pip install -e .claude/python[dev]

      - name: Framework smoke test
        run: python .claude/python/sdd_admin/framework_smoke.py

      - name: pytest + coverage (audit M6 ; -n auto P2 perf ; --cov-fail-under no-regression P0 v2 2026-06-08)
        run: |
          cd .claude/python
          # -n auto = pytest-xdist parallel runner (audit P2 perf 2026-06-08).
          #
          # --cov-fail-under=46 = NO-REGRESSION gate (audit P0 v2 audit 2026-06-08).
          # Coverage actuel mesuré ~46% (faux vert CI précédent : --cov sans
          # --cov-fail-under ignorait le seuil pyproject 60%). On enforce d'abord
          # le current pour bloquer toute régression. Roadmap Sprint 9.1+ :
          # combler les modules load-bearing à 0% (complexity_router 0%,
          # validate_readiness 28%, sdd_review 15%, validate_fidelity 16%,
          # validate_semantic 15%) puis monter en paliers 46 → 60 → 70 → 80
          # (parité CoverageMin user projects). Cf. roadmap-v7-v8.md Sprint 9.x.
          python -m pytest tests/ -q --tb=short -n auto \
            --cov=sdd_lib --cov=sdd_scripts --cov=sdd_hooks --cov=sdd_admin \
            --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=46

      - name: Upload coverage artifact (audit M6)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: .claude/python/coverage.xml
          if-no-files-found: warn

      - name: Inline rules drift check (audit m10, strict in CI)
        run: python .claude/python/sdd_scripts/validate_inline_rules.py --strict

      - name: Templates linter (audit m3, strict in CI)
        run: python .claude/python/sdd_admin/validate_templates.py --strict

      - name: ADR filename format (audit M2, HHmmss[-rand4])
        shell: bash
        run: |
          set -e
          # Spec : ADR-{YYYYMMDDTHHmmss}(-{rand4})?-{slug}.md
          pattern='^ADR-[0-9]{8}T[0-9]{6}(-[a-z0-9]{4})?-[a-z0-9-]+\.md$'
          bad=0
          for f in .claude/docs/adrs/ADR-*.md workspace/output/.sys/.context/adrs/ADR-*.md ; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if ! echo "$base" | grep -qE "$pattern" ; then
              echo "❌ ADR filename non conforme : $base"
              bad=$((bad+1))
            fi
          done
          if [ $bad -gt 0 ] ; then
            echo "FAIL : $bad ADR filename(s) hors spec ownership.md §3."
            exit 1
          fi
          echo "OK : tous les ADR filenames respectent la spec."

      - name: Pricing freshness check (audit m4)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.claude/python')
          from sdd_lib import pricing
          fresh, age, last = pricing.check_pricing_freshness(max_age_days=90)
          print(f'pricing.py reviewed {last} ({age}d ago) — fresh={fresh}')
          if not fresh:
              print('::warning::pricing.py stale > 90d (audit m4). Review https://www.anthropic.com/pricing and bump PRICING_LAST_REVIEWED.')
          "

      - name: Validate libs catalogs schema
        run: python .claude/python/sdd_admin/validate_libs_catalog.py

      - name: Validate stack md headers (Validation: 🟢|🟡)
        run: python .claude/python/sdd_admin/validate_stack_md_headers.py

      - name: Lint Python (ruff)
        # P1-4 fix 2026-06-07 : ruff is now blocking. Baseline established —
        # any new lint violation must be fixed (or `# noqa: SPECIFIC_CODE`
        # with justification). To bypass per-PR : add `continue-on-error: true`
        # explicitly with `[skip-ruff]` in commit message + reviewer approval.
        run: |
          pip install ruff==0.6.9
          ruff check .claude/python/

  bootstrap-combos:
    # Audit P2 perf 2026-06-08 — was 5 sequential bootstrap steps (~15-25 s
    # cumulative) + 5 sequential validate_stack_combo steps in
    # framework-validation. Now parallel matrix : 5 jobs in parallel,
    # ~3-5 s wall-clock each = effective ~5× speedup on this phase.
    name: Bootstrap dry-run + stack combo validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo: [c1, c2, c3, c4, c5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SDD_Pro Python tools
        run: pip install -e .claude/python[dev]

      - name: Validate stack combo ${{ matrix.combo }}
        run: |
          if [ "${{ matrix.combo }}" = "c1" ] || [ "${{ matrix.combo }}" = "c2" ]; then
            python .claude/python/sdd_scripts/validate_stack_combo.py --combo ${{ matrix.combo }}
          else
            python .claude/python/sdd_scripts/validate_stack_combo.py --combo ${{ matrix.combo }} || echo "${{ matrix.combo }} experimental (non-blocking)"
          fi

      - name: Bootstrap auto-init dry-run — combo ${{ matrix.combo }}
        env:
          SDD_APP_NAME: CIApp
          SDD_COMBO: ${{ matrix.combo }}
          SDD_DB_TYPE: PostgreSql
          # C1/C2 = reference validated, no bypass needed.
          # C3/C4/C5 = experimental, require SDD_ALLOW_UNTESTED_COMBO.
          SDD_ALLOW_UNTESTED_COMBO: ${{ (matrix.combo == 'c1' || matrix.combo == 'c2') && '' || '1' }}
        run: python bootstrap.py --auto-init --dry-run --skip-install

  console-build:
    name: Console web build smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.5+ (node:sqlite native)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace/console/package-lock.json

      - name: Install console deps
        working-directory: workspace/console
        run: npm ci --no-audit --no-fund

      - name: Server.js + lib/*.js syntax check
        working-directory: workspace/console
        run: |
          node --check server.js
          node --check lib/atomic-write.js
          node --check lib/console-db.js
          node --check lib/explain.js
          node --check lib/markdown-filter.js

      - name: Build console (esbuild — replaces Babel-CDN runtime, v0.4.1)
        working-directory: workspace/console
        run: npm run build

      - name: npm test (server syntax + esbuild bundle + CSP regression)
        working-directory: workspace/console
        run: npm test

      - name: Server boot smoke (start, ping /api/tree, stop)
        working-directory: workspace/console
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3
          curl -fsS -k -m 5 https://127.0.0.1:4000/api/health || curl -fsS -m 5 http://127.0.0.1:4000/api/health
          kill $SERVER_PID 2>/dev/null || true
