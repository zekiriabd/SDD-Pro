name: Nightly E2E (combo C1)

# Nightly health check : runs the deterministic SDD_Pro pipeline + (when
# ANTHROPIC_API_KEY is exposed as a secret) a real /sdd-full on a minimal
# FEAT fixture.
#
# Goals :
#   - Catch regressions in bootstrap, smoke, validators, pytest (always)
#   - Catch regressions in agent contracts / prompt drift (when API key set)
#
# Cost cap : MaxCostPerRun=$5 forces the full pipeline to fail-fast if a
# regression makes the run run unbounded.

on:
  schedule:
    # 02:30 UTC every day (low Anthropic API load + after Tech Lead sleeps)
    - cron: "30 2 * * *"
  # Manual trigger button on the Actions page
  workflow_dispatch:
    inputs:
      run_full_pipeline:
        description: "Run the full /sdd-full pipeline (requires ANTHROPIC_API_KEY)"
        type: boolean
        default: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  deterministic:
    name: Deterministic checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        working-directory: .claude/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bootstrap combo C1 (dry-run on tmp dir)
        run: |
          # Copy framework into a fresh tmp dir + invoke bootstrap on it,
          # so a regression in bootstrap.py fails the nightly even if
          # workspace/input/* of THIS repo already has FEATs.
          tmpdir=$(mktemp -d)
          cp -r .claude "$tmpdir/"
          cp bootstrap.py "$tmpdir/"
          # stack.md.template lives in .claude/templates/ since 2026-05-22 (déjà copié via .claude recursive ci-dessus)
          mkdir -p "$tmpdir/workspace/input/stack"
          mkdir -p "$tmpdir/workspace/input/feats" "$tmpdir/workspace/input/ui"
          cd "$tmpdir"
          # Provide answers : AppName=NightlyCi, backend=default, db=PostgreSql, proceed=y
          printf "NightlyCi\n\nPostgreSql\ny\n" | \
            python bootstrap.py --combo c1 --skip-install
          # Verify stack.md was generated
          test -f workspace/input/stack/stack.md
          grep -q "AppName: NightlyCi" workspace/input/stack/stack.md
          grep -q "dotnet-minimalapi" workspace/input/stack/stack.md

      - name: Framework smoke (strict)
        run: |
          python .claude/python/sdd_admin/framework_smoke.py --strict

      - name: Strict validators
        run: |
          python .claude/python/sdd_scripts/validate_inline_rules.py --strict
          python .claude/python/sdd_scripts/validate_project_config.py --strict-unknown
          python .claude/python/sdd_admin/validate_libs_catalog.py
          python .claude/python/sdd_admin/validate_stack_md_headers.py --strict

      - name: pytest
        working-directory: .claude/python
        run: pytest --tb=short -q

  e2e-full-pipeline:
    name: Full /sdd-full pipeline (gated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only runs when an API key secret is configured. Without it, the job
    # is skipped (no failure, just absent — keeps the public-repo workflow
    # green by default).
    needs: deterministic
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Hard cost cap : if the run goes beyond $5, preflight_cost_cap.py
      # blocks the next Agent spawn with [COST_CAP_EXCEEDED] (exit 2).
      SDD_REPO_ROOT: ${{ github.workspace }}/e2e-tmp
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 20 (for workspace/console)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up .NET 8 (combo C1 backend)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Python deps
        working-directory: .claude/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bootstrap E2E project
        run: |
          mkdir -p e2e-tmp
          cp -r .claude e2e-tmp/
          cp bootstrap.py e2e-tmp/
          # stack.md.template lives in .claude/templates/ since 2026-05-22 (déjà copié via .claude recursive ci-dessus)
          mkdir -p e2e-tmp/workspace/input/{stack,feats,ui}
          cp .claude/python/tests/fixtures/e2e-combo-c1/1-Minimal.md \
             e2e-tmp/workspace/input/feats/
          cd e2e-tmp
          printf "HelloApp\n\nnone\ny\n" | \
            python bootstrap.py --combo c1 --skip-install --force
          # Force cap to $5 for safety
          sed -i 's/^MaxCostPerRun:.*/MaxCostPerRun: 5/' \
            workspace/input/stack/stack.md
          # Disable QA mutation testing (out of scope for nightly E2E)
          sed -i 's/^MutationTestingMode:.*/MutationTestingMode: "off"/' \
            workspace/input/stack/stack.md || true

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash || \
            echo "::warning::Claude Code CLI install endpoint unavailable — skipping"
          echo "$HOME/.claude/bin" >> $GITHUB_PATH

      - name: Run /sdd-full 1 on minimal FEAT
        working-directory: e2e-tmp
        run: |
          # The actual invocation depends on Claude Code CLI being available.
          # If the CLI isn't installable in CI yet (transient), skip with WARN.
          if ! command -v claude &> /dev/null; then
            echo "::warning::claude CLI unavailable — full E2E skipped (deterministic part passed)"
            exit 0
          fi
          # Headless run with explicit cost cap
          claude --headless --prompt "/sdd-full 1" || {
            ec=$?
            echo "::error::/sdd-full 1 failed with exit $ec"
            # Surface key reports
            test -f workspace/output/qa/feat-1/review.md && \
              cat workspace/output/qa/feat-1/review.md
            exit $ec
          }

      - name: Verify code was generated
        working-directory: e2e-tmp
        run: |
          test -d workspace/output/src/HelloApp || \
            { echo "frontend project missing"; exit 1; }
          test -d workspace/output/src/HelloAppBack || \
            { echo "backend project missing"; exit 1; }
          # Verify the welcome endpoint exists
          grep -r "welcome" workspace/output/src/HelloAppBack/ | head -3

      - name: Upload generated workspace as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-c1-output-${{ github.run_id }}
          path: e2e-tmp/workspace/output/
          retention-days: 7

      - name: Telemetry health
        if: always()
        working-directory: e2e-tmp
        run: |
          python .claude/python/sdd_admin/verify_telemetry_health.py --json | \
            tee telemetry-health.json
          # Final cost should NOT exceed cap (sanity)
          python .claude/python/sdd_scripts/report_token_usage.py | head -30
