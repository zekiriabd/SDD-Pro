<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo — Rapport du jour</title>
<link rel="stylesheet" href="design-system.css">
<style>
  .app{flex:1;display:flex;flex-direction:column;background:var(--nj-cream);overflow:hidden}

  /* ---- Top bar ---- */
  .topbar{height:var(--nj-topbar-h);flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--nj-surface);border-bottom:1px solid var(--nj-line-soft)}
  .topbar__back{width:38px;height:38px;border-radius:999px;background:var(--nj-coral-50);color:var(--nj-coral-700);border:0;display:grid;place-items:center;cursor:pointer;text-decoration:none}
  .topbar__title{flex:1;font-size:15px;font-weight:800;color:var(--nj-ink-900);letter-spacing:-0.015em;min-width:0}
  .topbar__avatar{width:38px;height:38px;border-radius:999px;overflow:hidden;flex-shrink:0;box-shadow:inset 0 0 0 2px #fff, 0 2px 6px rgba(40,20,10,0.10)}
  .topbar__avatar img{width:100%;height:100%;object-fit:cover;display:block}

  /* ---- Stepper ---- */
  .stepper{flex-shrink:0;padding:14px 16px 8px;background:var(--nj-surface);border-bottom:1px solid var(--nj-line-soft)}
  .stepper__track{display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .stepper__node{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;cursor:pointer}
  .stepper__dot{width:30px;height:30px;border-radius:999px;background:var(--nj-line-soft);color:var(--nj-ink-400);display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid transparent;transition:all var(--nj-dur) var(--nj-ease)}
  .stepper__node.is-done .stepper__dot{background:var(--nj-sage-500);color:#fff}
  .stepper__node.is-current .stepper__dot{background:var(--nj-coral-500);color:#fff;box-shadow:0 0 0 4px var(--nj-coral-100)}
  .stepper__label{font-size:10.5px;font-weight:600;color:var(--nj-ink-400);letter-spacing:0.01em;text-align:center;line-height:1.1}
  .stepper__node.is-current .stepper__label{color:var(--nj-coral-700)}
  .stepper__node.is-done .stepper__label{color:var(--nj-sage-700)}
  .stepper__line{position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--nj-line);z-index:-1}
  .stepper__node.is-done .stepper__line{background:var(--nj-sage-300)}
  .stepper__node:last-child .stepper__line{display:none}
  .stepper__progress{height:3px;background:var(--nj-line-soft);border-radius:999px;overflow:hidden}
  .stepper__progress span{display:block;height:100%;background:linear-gradient(90deg,var(--nj-coral-500),var(--nj-coral-400));border-radius:999px;transition:width var(--nj-dur) var(--nj-ease)}

  /* ---- Body ---- */
  .body{flex:1;overflow-y:auto;padding:20px 16px 12px;display:flex;flex-direction:column;gap:16px}
  .body>*{flex-shrink:0}

  .step{display:none;flex-direction:column;gap:14px}
  .step.is-active{display:flex;animation:slideIn .35s var(--nj-ease)}
  @keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}

  .step__head h2{margin:0;font-size:22px;font-weight:800;color:var(--nj-ink-900);letter-spacing:-0.02em;display:flex;align-items:center;gap:10px}
  .step__head h2 .step-num{
    width:32px;height:32px;border-radius:10px;background:var(--nj-coral-500);color:#fff;
    display:grid;place-items:center;font-size:14px;font-weight:800;
    box-shadow:var(--nj-shadow-brand);
  }
  .step__head p{margin:6px 0 0 0;font-size:12.5px;color:var(--nj-ink-500);line-height:1.5}

  /* ---- Selectable grid ---- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .cell{
    position:relative;display:flex;flex-direction:column;align-items:center;
    gap:7px;padding:14px 8px 12px;
    background:var(--nj-surface);border:1.5px solid var(--nj-line);border-radius:14px;
    cursor:pointer;font-family:inherit;text-align:center;
    transition:transform var(--nj-dur-fast) var(--nj-ease), border-color var(--nj-dur-fast) var(--nj-ease), background var(--nj-dur-fast) var(--nj-ease);
  }
  .cell:active{transform:scale(0.97)}
  .cell__icon{
    width:40px;height:40px;border-radius:12px;
    background:var(--nj-cream);color:var(--nj-coral-700);
    display:grid;place-items:center;flex-shrink:0;font-size:22px;line-height:1;
  }
  .cell__icon svg{display:block}
  .cell__label{font-size:12.5px;font-weight:600;color:var(--nj-ink-900);letter-spacing:-0.005em;line-height:1.2}
  .cell__check{
    position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:999px;
    background:transparent;border:1.5px solid var(--nj-line);
    display:grid;place-items:center;color:transparent;
    transition:all var(--nj-dur-fast) var(--nj-ease);
  }
  .cell.is-on{background:var(--nj-coral-50);border-color:var(--nj-coral-500)}
  .cell.is-on .cell__icon{background:var(--nj-coral-100);color:var(--nj-coral-700)}
  .cell.is-on .cell__check{background:var(--nj-coral-500);border-color:var(--nj-coral-500);color:#fff}

  /* "No issue" full-width cell */
  .cell--full{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:12px;padding:13px 14px;text-align:left}
  .cell--full .cell__icon{background:var(--nj-sage-50);color:var(--nj-sage-700)}
  .cell--full.is-on{background:var(--nj-sage-50);border-color:var(--nj-sage-500)}
  .cell--full.is-on .cell__icon{background:var(--nj-sage-100);color:var(--nj-sage-700)}
  .cell--full.is-on .cell__check{background:var(--nj-sage-500);border-color:var(--nj-sage-500);color:#fff}
  .cell--full .cell__label{font-size:14px;font-weight:700}
  .cell--full .cell__label small{display:block;font-size:11px;font-weight:500;color:var(--nj-ink-500);margin-top:2px}

  /* Mood cells: bigger emoji */
  .cell--mood .cell__icon{background:transparent;font-size:32px;width:auto;height:auto}

  /* Custom add input */
  .add-row{
    display:flex;gap:8px;align-items:center;
    background:var(--nj-surface);border:1.5px dashed var(--nj-coral-300);
    border-radius:13px;padding:0 12px;
  }
  .add-row input{
    flex:1;border:0;outline:0;background:transparent;
    height:42px;font-family:inherit;font-size:13.5px;color:var(--nj-ink-900);
  }
  .add-row button{
    background:var(--nj-coral-500);color:#fff;border:0;border-radius:9px;
    padding:7px 12px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer
  }

  /* Section sub-label */
  .sub-label{
    display:flex;align-items:center;gap:8px;
    font-family:var(--nj-font-mono);font-size:10.5px;font-weight:500;
    color:var(--nj-coral-700);text-transform:uppercase;letter-spacing:.1em;
    margin-top:8px;
  }
  .sub-label::before{content:'';width:14px;height:2px;background:var(--nj-coral-400);border-radius:999px}

  /* ---- Footer ---- */
  .footer{flex-shrink:0;display:flex;gap:10px;padding:12px 16px 14px;background:var(--nj-surface);border-top:1px solid var(--nj-line-soft)}
  .btn{height:48px;border-radius:13px;border:0;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--nj-dur-fast) var(--nj-ease)}
  .btn:active{transform:scale(0.98)}
  .btn-ghost{background:var(--nj-coral-50);color:var(--nj-coral-700);flex:0 0 auto;padding:0 18px}
  .btn-primary{background:var(--nj-coral-500);color:#fff;flex:1;box-shadow:var(--nj-shadow-brand)}
  .btn-primary--save{background:linear-gradient(135deg,var(--nj-sage-500),oklch(0.62 0.085 168))}

  .home-indicator{height:8px;display:flex;justify-content:center;align-items:flex-start;flex-shrink:0;background:var(--nj-surface)}
  .home-indicator::after{content:'';width:134px;height:5px;background:var(--nj-ink-900);border-radius:999px;opacity:.92}
</style>
</head>
<body>
<div class="nj-stage">
  <div class="nj-phone">
    <div class="nj-phone__notch"></div>
    <div class="nj-phone__screen">
      <div class="nj-statusbar"><span>9:41</span><span class="nj-statusbar__icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.5"></rect><rect x="4.5" y="5" width="3" height="6" rx="0.5"></rect><rect x="9" y="3" width="3" height="8" rx="0.5"></rect><rect x="13.5" y="0" width="3" height="11" rx="0.5"></rect></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 0C4.6 0 1.9 1 0 2.7l1.4 1.5C2.9 2.8 5.1 1.9 7.5 1.9s4.6.9 6.1 2.3L15 2.7C13.1 1 10.4 0 7.5 0zm0 3.7c-2 0-3.7.7-5.1 1.9l1.4 1.4c1-.9 2.3-1.4 3.7-1.4s2.7.5 3.7 1.4L12.6 5.6C11.2 4.4 9.5 3.7 7.5 3.7zm0 3.7c-1.1 0-2 .4-2.7 1l2.7 2.6 2.7-2.6c-.7-.6-1.6-1-2.7-1z"></path></svg>
        <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="currentColor" opacity="0.5"></rect><rect x="2" y="2" width="18" height="7" rx="1.5" fill="currentColor"></rect><rect x="22.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor" opacity="0.5"></rect></svg>

      <div class="app" data-screen-label="07 Rapport du jour">

        <!-- Top bar -->

        <!-- Stepper -->

        <!-- BODY -->

          <!-- ============ STEP 1 — SANTÉ ============ -->

            <div class="grid">

              <button class="cell" data-toggle>

                </div>
                <div class="cell__label">Rhume / Nez qui coule</div>
                <div class="cell__check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
              </button>
              <button class="cell" data-toggle>
                <div class="cell__icon">
                  <!-- belly (frown circle) -->

              </button>
              <button class="cell is-on" data-toggle>
                <div class="cell__icon">
                  <!-- bandage -->
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3l-7 7a2 2 0 0 0 0 2.83l7 7a2 2 0 0 0 2.83 0l7-7a2 2 0 0 0 0-2.83l-7-7a2 2 0 0 0-2.83 0z"></path><path d="M9 12h.01M12 9h.01M12 12h.01M12 15h.01M15 12h.01"></path></svg>

                <div class="cell__check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>

              </button>

<script>
(function(){
  const TOTAL = 4;
  let current = 1;

  const stepCount = document.getElementById('stepCount');
  const bar = document.getElementById('stepperBar');
  const btnNext = document.getElementById('btnNext');
  const nodes = document.querySelectorAll('.stepper__node');
  const steps = document.querySelectorAll('.step');
  const body = document.querySelector('.body');

  function render(){
    if (stepCount) stepCount.textContent = `ÉTAPE ${current}/${TOTAL}`;
    bar.style.width = (current / TOTAL * 100) + '%';
    nodes.forEach(n => {
      const s = +n.dataset.step;
      n.classList.toggle('is-current', s === current);
      n.classList.toggle('is-done', s < current);
    });
    steps.forEach(s => s.classList.toggle('is-active', +s.dataset.step === current));
    if (current === TOTAL) {
      btnNext.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Enregistrer`;
    } else {
      btnNext.innerHTML = `Suivant <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
    }
    if (body) body.scrollTop = 0;
  }

  btnNext.addEventListener('click', () => {
    if (current < TOTAL) { current++; render(); }
    else {
      btnNext.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Rapport enregistré`;
      btnNext.disabled = true;
    }
  });
  nodes.forEach(n => n.addEventListener('click', () => {
    current = +n.dataset.step; render();
  }));

  // toggle cells
  document.querySelectorAll('[data-toggle]').forEach(cell => {
    cell.addEventListener('click', () => cell.classList.toggle('is-on'));
  });
})();
</script>
</body>
</html>
