<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo — Rapport</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  body { background: var(--nj-gradient-mesh); min-height: 100vh; display: grid; place-items: center; padding: 36px 16px; }

  .app { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--nj-cream); }

  /* ---- top bar ---- */
  .topbar { height: var(--nj-topbar-h); flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--nj-surface); border-bottom: 1px solid var(--nj-line-soft); }
  .topbar__back { width: 38px; height: 38px; border-radius: 999px; background: var(--nj-coral-50); color: var(--nj-coral-700); border: 0; display: grid; place-items: center; cursor: pointer; text-decoration: none; }
  .topbar__title { flex: 1; font-size: 18px; font-weight: 800; color: var(--nj-ink-900); letter-spacing: -0.02em; }

  /* ---- tabs (icône + titre, soulignement) ---- */
  .tabs { flex-shrink: 0; background: var(--nj-surface); border-bottom: 1px solid var(--nj-line-soft); padding: 0 6px; display: flex; position: relative; z-index: 2; }
  .tabs__btn {
    flex: 1; padding: 12px 4px 10px; background: transparent; border: 0; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--nj-ink-500);
    display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative;
    transition: color var(--nj-dur-fast);
  }
  .tabs__btn .material-symbols-outlined { font-size: 22px; }
  .tabs__btn.is-active { color: var(--nj-coral-700); }
  .tabs__btn.is-active::after { content: ''; position: absolute; left: 18%; right: 18%; bottom: -1px; height: 3px; background: var(--nj-coral-500); border-radius: 3px 3px 0 0; }

  /* ---- body ---- */
  .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pane { display: none; }
  .pane.is-active { display: block; animation: fade var(--nj-dur) var(--nj-ease); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .day-label {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 20px 4px; font-size: 12px; font-weight: 700; color: var(--nj-ink-500);
  }
  .day-label::before, .day-label::after { content: ''; height: 1px; background: var(--nj-line); flex: 1; }
  .pending-note { padding: 0 20px 8px; font-size: 12px; color: var(--nj-ink-400); text-align: center; }

  /* ---- TAB 1 · chat-style report cards ---- */
  .reports { padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 18px; }
  .report { display: flex; gap: 11px; align-items: flex-start; }
  .report__avatar {
    width: 46px; height: 46px; border-radius: 999px; flex-shrink: 0; position: relative;
    overflow: hidden; box-shadow: inset 0 0 0 2px #fff, 0 2px 6px oklch(0.55 0.10 295 / 0.18); margin-top: 22px;
  }
  .report__avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .report__col { flex: 1; min-width: 0; }
  .report__head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 5px 4px; }
  .report__name { font-size: 14px; font-weight: 800; color: var(--nj-ink-900); letter-spacing: -0.01em; }
  .report__to { font-size: 11.5px; color: var(--nj-ink-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bubble {
    background: var(--nj-surface); border: 1px solid var(--nj-line-soft);
    border-radius: 6px 20px 20px 20px; padding: 14px 16px;
    box-shadow: var(--nj-shadow-sm);
  }
  .bubble__text { font-size: 13px; line-height: 1.55; color: var(--nj-ink-700); white-space: pre-line; }
  .bubble__foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--nj-line-soft); }
  .bubble__time { font-size: 11px; color: var(--nj-ink-400); font-family: var(--nj-font-mono); display: inline-flex; align-items: center; gap: 5px; }
  .btn-send {
    display: inline-flex; align-items: center; gap: 7px; border: 0; cursor: pointer;
    height: 38px; padding: 0 16px; border-radius: var(--nj-radius-pill);
    background: var(--nj-gradient-vivid); color: #fff; font-family: inherit; font-weight: 700; font-size: 13px;
    text-decoration: none; box-shadow: var(--nj-shadow-brand);
    transition: transform var(--nj-dur-fast), box-shadow var(--nj-dur-fast);
  }
  .btn-send:active { transform: scale(0.97); }
  .btn-send.is-sent { background: var(--nj-sage-50); color: var(--nj-sage-700); box-shadow: none; pointer-events: none; }

  /* ---- TAB 2 · history ---- */
  .hist-tools { padding: 16px 16px 6px; position: sticky; top: 0; background: var(--nj-cream); z-index: 1; }
  .search { position: relative; }
  .search > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--nj-ink-400); pointer-events: none; }
  .search input {
    width: 100%; height: 46px; border: 1px solid var(--nj-line); background: var(--nj-surface);
    border-radius: 14px; padding: 0 16px 0 42px; font-family: inherit; font-size: 14px; color: var(--nj-ink-900);
    box-shadow: var(--nj-shadow-xs); transition: border-color var(--nj-dur-fast), box-shadow var(--nj-dur-fast);
  }
  .search input::placeholder { color: var(--nj-ink-400); }
  .search input:focus { outline: none; border-color: var(--nj-coral-400); box-shadow: 0 0 0 4px oklch(0.93 0.05 8 / 0.7); }

  .hist-list { padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
  .hist-row {
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    background: var(--nj-surface); border: 1px solid var(--nj-line-soft);
    border-radius: var(--nj-radius-md); padding: 14px 16px; box-shadow: var(--nj-shadow-xs);
    transition: background var(--nj-dur-fast), transform var(--nj-dur-fast);
    text-align: left; font-family: inherit; width: 100%;
  }
  .hist-row:hover { background: var(--nj-coral-50); }
  .hist-row:active { transform: scale(0.99); }
  .hist-row__id { flex: 1; min-width: 0; }
  .hist-row__name { font-size: 15px; font-weight: 700; color: var(--nj-ink-900); letter-spacing: -0.01em; }
  .hist-row__meta { font-size: 12.5px; color: var(--nj-ink-500); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .hist-row__eye {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--nj-coral-50); color: var(--nj-coral-700);
    display: grid; place-items: center;
  }
  .hist-row__eye .material-symbols-outlined { font-size: 22px; }

  .hist-empty { text-align: center; padding: 40px 24px; color: var(--nj-ink-500); display: none; }
  .hist-empty.show { display: block; }
  .hist-empty b { display: block; font-size: 15px; color: var(--nj-ink-900); margin-bottom: 4px; }
  .hist-empty span { font-size: 13px; }

  /* ---- modal ---- */
  .modal { position: absolute; inset: 0; z-index: 40; display: none; }
  .modal.is-open { display: block; }
  .modal__scrim { position: absolute; inset: 0; background: oklch(0.30 0.06 295 / 0.42); backdrop-filter: blur(3px); animation: fade var(--nj-dur-fast) ease; }
  .modal__sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 82%;
    background: var(--nj-cream); border-radius: var(--nj-radius-2xl) var(--nj-radius-2xl) 0 0;
    box-shadow: var(--nj-shadow-lg); display: flex; flex-direction: column;
    animation: rise var(--nj-dur) var(--nj-ease);
  }
  @keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
  .modal__grab { width: 40px; height: 5px; border-radius: 999px; background: var(--nj-line); margin: 10px auto 4px; flex-shrink: 0; }
  .modal__head { display: flex; align-items: center; gap: 12px; padding: 8px 18px 14px; border-bottom: 1px solid var(--nj-line-soft); flex-shrink: 0; }
  .modal__avatar { width: 48px; height: 48px; border-radius: 999px; overflow: hidden; flex-shrink: 0; box-shadow: inset 0 0 0 2px #fff, 0 2px 6px oklch(0.55 0.10 295 / 0.18); }
  .modal__avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal__id { flex: 1; min-width: 0; }
  .modal__name { font-size: 16px; font-weight: 800; color: var(--nj-ink-900); letter-spacing: -0.01em; }
  .modal__date { font-size: 12.5px; color: var(--nj-ink-500); margin-top: 2px; }
  .modal__close { width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--nj-surface); color: var(--nj-ink-500); display: grid; place-items: center; cursor: pointer; box-shadow: var(--nj-shadow-xs); flex-shrink: 0; }
  .modal__body { padding: 18px; overflow-y: auto; }
  .modal__text {
    background: var(--nj-surface); border: 1px solid var(--nj-line-soft); border-radius: var(--nj-radius-lg);
    padding: 16px 18px; font-size: 13.5px; line-height: 1.6; color: var(--nj-ink-700); white-space: pre-line; box-shadow: var(--nj-shadow-xs);
  }
  .modal__foot { padding: 6px 18px 22px; flex-shrink: 0; }
  .modal__foot .btn-send { width: 100%; height: 50px; justify-content: center; font-size: 14.5px; }

  .home-indicator { height: 20px; flex-shrink: 0; display: grid; place-items: center; background: var(--nj-cream); }
  .home-indicator::after { content: ''; width: 130px; height: 5px; border-radius: 999px; background: var(--nj-ink-900); opacity: 0.22; }
</style>
</head>
<body>

<div class="nj-phone">
  <div class="nj-phone__notch"></div>
  <div class="nj-phone__screen">
    <div class="nj-statusbar">
      <span>9:41</span>
      <span class="nj-statusbar__icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.5"/><rect x="4.5" y="5" width="3" height="6" rx="0.5"/><rect x="9" y="3" width="3" height="8" rx="0.5"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 0C4.6 0 1.9 1 0 2.7l1.4 1.5C2.9 2.8 5.1 1.9 7.5 1.9s4.6.9 6.1 2.3L15 2.7C13.1 1 10.4 0 7.5 0z"/></svg>
        <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="18" height="7" rx="1.5" fill="currentColor"/><rect x="22.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor" opacity="0.5"/></svg>
      </span>
    </div>

    <div class="app" data-screen-label="17 Rapport">
      <div class="topbar">
        <a class="topbar__back" href="01-menu-principal.html" aria-label="Retour">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
        </a>
        <div class="topbar__title">Rapport</div>
      </div>

      <nav class="tabs" role="tablist">
        <button class="tabs__btn is-active" data-tab="today" role="tab">
          <span class="material-symbols-outlined">today</span>
          <span>Rapport du jour</span>
        </button>
        <button class="tabs__btn" data-tab="history" role="tab">
          <span class="material-symbols-outlined">history</span>
          <span>Historique</span>
        </button>
      </nav>

      <div class="body">

        <!-- ============ TAB 1 · RAPPORT DU JOUR ============ -->
        <section class="pane is-active" data-pane="today">
          <div class="reports" id="today-reports"></div>
        </section>

        <!-- ============ TAB 2 · HISTORIQUE ============ -->
        <section class="pane" data-pane="history">
          <div class="hist-tools">
            <div class="search">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="search" id="hist-q" placeholder="Rechercher un enfant ou une date…" aria-label="Rechercher">
            </div>
          </div>
          <div class="hist-list" id="hist-list"></div>
          <div class="hist-empty" id="hist-empty"><b>Aucun rapport trouvé</b><span>Modifiez votre recherche.</span></div>
        </section>

      </div>

      <!-- modal -->
      <div class="modal" id="modal" aria-hidden="true">
        <div class="modal__scrim" data-close></div>
        <div class="modal__sheet" role="dialog" aria-modal="true">
          <div class="modal__grab"></div>
          <div class="modal__head">
            <div class="modal__avatar"><img id="m-avatar" src="assets/avatar-default.svg" alt=""></div>
            <div class="modal__id">
              <div class="modal__name" id="m-name"></div>
              <div class="modal__date" id="m-date"></div>
            </div>
            <button class="modal__close" data-close aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
          <div class="modal__body"><div class="modal__text" id="m-text"></div></div>
          <div class="modal__foot">
            <a class="btn-send" id="m-send" href="#">
              <span class="material-symbols-outlined" style="font-size:18px">sms</span> Renvoyer par SMS
            </a>
          </div>
        </div>
      </div>

      <div class="home-indicator"></div>
    </div>
  </div>
</div>

<script>
  // ---- children (actifs) ----
  const KIDS = {
    lina: { name: 'Lina Bouchet',  avatar: 'assets/baby-lina.png', parents: 'Sophie & Marc',  tel: '0612345678' },
    tom:  { name: 'Tom Lefèvre',   avatar: 'assets/baby-tom.png',  parents: 'Julie & Karim',  tel: '0623456789' },
    noe:  { name: 'Noé Marin',     avatar: 'assets/baby-noe.png',  parents: 'Camille & Hugo', tel: '0634567890' }
  };

  // ---- reports today (enfants en garde aujourd'hui) ----
  const TODAY = [
    { kid: 'lina', time: '17:25', sent: false, text:
`Bonjour Sophie et Marc,
Lina a passé une belle journée.

Santé : tout va bien, juste une petite égratignure au genou, soignée.
Repas : biberon, légumes, fruits et un yaourt bien appréciés.
Activités : parc en matinée, cubes et lecture.
Humeur : joyeuse et beaucoup de rires.

À demain ! Demo User` },
    { kid: 'tom', time: '15:50', sent: false, text:
`Bonjour Julie et Karim,
Tom a eu une journée tout en douceur.

Santé : RAS, sieste de 2h ce midi.
Repas : a bien terminé sa purée et son biberon.
Activités : éveil musical et jeux au sol.
Humeur : calme et très câlin aujourd'hui.

À demain ! Demo User` }
  ];

  // ---- history (rapports passés, enfants actifs) ----
  const HISTORY = [
    { kid: 'lina', date: '2026-05-28', label: '28 mai 2026', text:
`Bonjour Sophie et Marc,
Lina a très bien mangé aujourd'hui et a fait une longue sieste. Promenade au parc l'après-midi, elle a adoré les balançoires. Humeur joyeuse. À demain ! Demo User` },
    { kid: 'tom', date: '2026-05-28', label: '28 mai 2026', text:
`Bonjour Julie et Karim,
Tom a un peu pleuré au réveil mais s'est vite consolé. Bon appétit ce midi. Beaucoup de jeux d'éveil. À demain ! Demo User` },
    { kid: 'noe', date: '2026-05-27', label: '27 mai 2026', text:
`Bonjour Camille et Hugo,
Noé a passé une excellente journée : peinture le matin, sieste réparatrice, et jeux en extérieur. Très en forme ! À demain ! Demo User` },
    { kid: 'lina', date: '2026-05-27', label: '27 mai 2026', text:
`Bonjour Sophie et Marc,
Lina était un peu fatiguée aujourd'hui, sieste prolongée. Repas pris normalement. Lecture et câlins. À demain ! Demo User` },
    { kid: 'tom', date: '2026-05-26', label: '26 mai 2026', text:
`Bonjour Julie et Karim,
Belle journée pour Tom : il commence à se tenir assis tout seul ! Bon appétit et bonne humeur. À demain ! Demo User` },
    { kid: 'noe', date: '2026-05-26', label: '26 mai 2026', text:
`Bonjour Camille et Hugo,
Noé a beaucoup parlé aujourd'hui, il répète plein de mots. Repas complet, sieste correcte. À demain ! Demo User` }
  ];

  const today = new Date();

  const smsHref = (tel, body) => 'sms:' + tel + '?&body=' + encodeURIComponent(body);

  // ---- render today ----
  const tWrap = document.getElementById('today-reports');
  tWrap.innerHTML = TODAY.map((r, i) => {
    const k = KIDS[r.kid];
    return `
    <div class="report">
      <div class="report__avatar"><img src="${k.avatar}" alt="${k.name}"></div>
      <div class="report__col">
        <div class="report__head">
          <span class="report__name">${k.name}</span>
          <span class="report__to">→ ${k.parents}</span>
        </div>
        <div class="bubble">
          <div class="bubble__text">${r.text}</div>
          <div class="bubble__foot">
            <a class="btn-send" data-send="${i}" href="${smsHref(k.tel, r.text)}">
              <span class="material-symbols-outlined" style="font-size:18px">send</span> Envoyer
            </a>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  // mark as "sent" visual once tapped
  tWrap.querySelectorAll('[data-send]').forEach(btn => {
    btn.addEventListener('click', () => {
      setTimeout(() => {
        btn.classList.add('is-sent');
        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px">check</span> Envoyé';
      }, 400);
    });
  });

  // ---- render history (grouped by date) ----
  const histList = document.getElementById('hist-list');
  const histEmpty = document.getElementById('hist-empty');
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  function renderHistory(q = '') {
    const nq = norm(q);
    const items = HISTORY.filter(r => {
      const k = KIDS[r.kid];
      return !nq || norm(k.name + ' ' + r.label).includes(nq);
    });
    histEmpty.classList.toggle('show', items.length === 0);
    histList.innerHTML = items.map(r => {
      const k = KIDS[r.kid];
      const i = HISTORY.indexOf(r);
      return `
      <div class="hist-row" data-open="${i}">
        <span class="hist-row__id">
          <span class="hist-row__name">${k.name}</span>
          <span class="hist-row__meta"><span class="material-symbols-outlined" style="font-size:15px">calendar_today</span>${r.label}</span>
        </span>
        <button class="hist-row__eye" aria-label="Voir le rapport"><span class="material-symbols-outlined">visibility</span></button>
      </div>`;
    }).join('');
    histList.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openModal(+b.dataset.open)));
  }
  renderHistory();
  document.getElementById('hist-q').addEventListener('input', e => renderHistory(e.target.value));

  // ---- modal ----
  const modal = document.getElementById('modal');
  function openModal(i) {
    const r = HISTORY[i], k = KIDS[r.kid];
    document.getElementById('m-avatar').src = k.avatar;
    document.getElementById('m-avatar').alt = k.name;
    document.getElementById('m-name').textContent = k.name;
    document.getElementById('m-date').textContent = r.label + ' · à ' + k.parents;
    document.getElementById('m-text').textContent = r.text;
    document.getElementById('m-send').href = smsHref(k.tel, r.text);
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
  }
  modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => {
    modal.classList.remove('is-open'); modal.setAttribute('aria-hidden', 'true');
  }));

  // ---- tabs ----
  const tabs = document.querySelectorAll('.tabs__btn');
  const panes = document.querySelectorAll('.pane');
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.toggle('is-active', x === t));
    panes.forEach(p => p.classList.toggle('is-active', p.dataset.pane === t.dataset.tab));
  }));
</script>

</body>
</html>
