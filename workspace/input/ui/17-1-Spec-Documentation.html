<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo — Documentation</title>
<link rel="stylesheet" href="design-system.css">
<style>
  .app {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 18px 14px;
    flex-shrink: 0;
  }
  .topbar__menu {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border: 0;
    border-radius: var(--nj-radius-md);
    background: var(--nj-surface);
    color: var(--nj-ink-700);
    box-shadow: var(--nj-shadow-xs);
    cursor: pointer;
  }
  .topbar__title { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .topbar__title em { font-style: normal; color: var(--nj-coral-600); }
  .topbar__spacer { flex: 1; }

  /* scroll area */
  .doc-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 4px 18px 24px;
    -webkit-overflow-scrolling: touch;
  }

  /* search */
  .doc-search {
    position: relative;
    display: flex;
    align-items: center;
    margin: 4px 0 16px;
  }
  .doc-search__icon {
    position: absolute;
    left: 14px;
    color: var(--nj-ink-400);
    pointer-events: none;
  }
  .doc-search__input {
    flex: 1;
    width: 100%;
    height: 46px;
    padding: 0 42px 0 42px;
    border: 1px solid var(--nj-line);
    border-radius: var(--nj-radius-pill);
    background: var(--nj-surface);
    font-family: var(--nj-font-sans);
    font-size: 15px;
    color: var(--nj-ink-900);
    box-shadow: var(--nj-shadow-xs);
    outline: none;
    transition: border-color var(--nj-dur-fast), box-shadow var(--nj-dur-fast);
  }
  .doc-search__input::placeholder { color: var(--nj-ink-400); }
  .doc-search__input:focus {
    border-color: var(--nj-coral-400);
    box-shadow: 0 0 0 4px oklch(0.93 0.05 8 / 0.7);
  }
  .doc-search__input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .doc-search__clear {
    position: absolute;
    right: 8px;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border: 0;
    border-radius: 50%;
    background: var(--nj-cream);
    color: var(--nj-ink-500);
    cursor: pointer;
  }
  .doc-empty {
    text-align: center;
    font-size: 14px;
    color: var(--nj-ink-400);
    padding: 32px 0;
  }

  /* page intro */
  .doc-head { padding: 4px 4px 18px; }
  .doc-head__eyebrow {
    font-family: var(--nj-font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--nj-coral-600);
    margin: 0 0 6px;
  }
  .doc-head__title {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin: 0 0 6px;
    line-height: 1.1;
  }
  .doc-head__sub { font-size: 13px; color: var(--nj-ink-500); margin: 0; line-height: 1.45; }

  /* section label */
  .doc-section {
    font-family: var(--nj-font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--nj-ink-400);
    margin: 22px 4px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .doc-section::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--nj-line);
  }

  /* document row */
  .doc-list { display: flex; flex-direction: column; gap: 10px; }
  .doc-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    background: var(--nj-surface);
    border: 1px solid var(--nj-line-soft);
    border-radius: var(--nj-radius-lg);
    box-shadow: var(--nj-shadow-xs);
    text-decoration: none;
    color: inherit;
    transition: transform var(--nj-dur-fast), box-shadow var(--nj-dur-fast), border-color var(--nj-dur-fast);
  }
  .doc-item:hover {
    transform: translateY(-1px);
    box-shadow: var(--nj-shadow-md);
    border-color: var(--nj-line);
  }
  .doc-item:active { transform: scale(0.99); }

  /* type icon tile */
  .doc-item__icon {
    width: 46px; height: 46px;
    flex-shrink: 0;
    border-radius: var(--nj-radius-md);
    display: grid;
    place-items: center;
    position: relative;
  }
  .doc-item__icon--pdf  { background: oklch(0.95 0.04 18);  color: var(--nj-danger); }
  .doc-item__icon--site { background: var(--nj-sky-50);     color: var(--nj-sky-700); }
  .doc-item__icon--link { background: var(--nj-lavender-50); color: var(--nj-lavender-700); }
  .doc-item__icon--legal{ background: oklch(0.96 0.01 295); color: var(--nj-ink-500); }

  /* body */
  .doc-item__body { flex: 1; min-width: 0; }
  .doc-item__name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.25;
    margin: 0 0 4px;
    color: var(--nj-ink-900);
  }
  .doc-item__meta {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .doc-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    line-height: 1.5;
  }
  .doc-badge--pdf  { background: oklch(0.95 0.04 18);  color: var(--nj-danger); }
  .doc-badge--app  { background: var(--nj-mint-100);   color: oklch(0.42 0.10 165); }
  .doc-badge--web  { background: var(--nj-sky-50);     color: var(--nj-sky-700); }
  .doc-badge--off  { background: var(--nj-lavender-50);color: var(--nj-lavender-700); }
  .doc-badge svg { width: 11px; height: 11px; }
  .doc-item__src {
    font-size: 11px;
    color: var(--nj-ink-400);
    font-family: var(--nj-font-mono);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 130px;
  }

  /* action chevron */
  .doc-item__action {
    width: 30px; height: 30px;
    flex-shrink: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--nj-cream);
    color: var(--nj-ink-400);
    transition: background var(--nj-dur-fast), color var(--nj-dur-fast);
  }
  .doc-item:hover .doc-item__action { background: var(--nj-coral-500); color: #fff; }

  /* tab bar */
  .tabbar {
    flex-shrink: 0;
    height: var(--nj-tabbar-h);
    background: var(--nj-surface);
    border-top: 1px solid var(--nj-line);
    display: flex;
    align-items: stretch;
    padding: 8px 8px 0;
  }
  .tab {
    flex: 1;
    border: 0;
    background: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--nj-ink-400);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab .icon { width: 23px; height: 23px; }
  .tab--active { color: var(--nj-coral-600); }
  .tab a { color: inherit; text-decoration: none; display: contents; }

  .home-indicator {
    height: 22px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: var(--nj-surface);
  }
  .home-indicator::after {
    content: "";
    width: 130px; height: 5px;
    border-radius: 999px;
    background: var(--nj-ink-900);
    opacity: 0.25;
  }
</style>
</head>

<script>
  (function () {
    const input = document.getElementById('docSearch');
    const clear = document.getElementById('docClear');
    const empty = document.getElementById('docEmpty');
    const items = Array.from(document.querySelectorAll('.doc-item'));
    const lists = Array.from(document.querySelectorAll('.doc-list'));

    function normalize(s) {
      return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function filter() {
      const q = normalize(input.value.trim());
      clear.hidden = input.value.length === 0;
      let shown = 0;
      items.forEach(it => {
        const name = normalize(it.querySelector('.doc-item__name').textContent);
        const match = !q || name.includes(q);
        it.style.display = match ? '' : 'none';
        if (match) shown++;
      });
      // hide empty list groups
      lists.forEach(list => {
        const anyVisible = list.querySelector('.doc-item:not([style*="display: none"])');
        list.style.display = anyVisible ? '' : 'none';
      });
      empty.hidden = shown !== 0;
    }

    input.addEventListener('input', filter);
    clear.addEventListener('click', () => { input.value = ''; input.focus(); filter(); });
  })();
</script>
