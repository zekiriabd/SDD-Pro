<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizard 3 étapes — example SDD_Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">

  <main class="w-full max-w-2xl bg-white rounded-lg shadow-md p-8">
    <header class="mb-6">
      <h1 class="text-2xl font-semibold text-slate-900">Créer un compte</h1>
      <p class="text-sm text-slate-500 mt-1">3 étapes — 2 minutes</p>

      <!-- Stepper -->
      <ol class="flex items-center mt-6 text-sm">
        <li class="flex items-center text-blue-600 font-medium">
          <span class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center">1</span>
          <span class="ml-2">Identité</span>
        </li>
        <li class="flex-1 h-px bg-slate-200 mx-3"></li>
        <li class="flex items-center text-slate-400">
          <span class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center">2</span>
          <span class="ml-2">Coordonnées</span>
        </li>
        <li class="flex-1 h-px bg-slate-200 mx-3"></li>
        <li class="flex items-center text-slate-400">
          <span class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center">3</span>
          <span class="ml-2">Confirmation</span>
        </li>
      </ol>
    </header>

    <form class="space-y-4">

      <!-- Étape 1 — Identité -->
      <section data-state="step-1">
        <h2 class="font-medium text-slate-800 mb-3">Étape 1 — Identité</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="firstname" class="block text-sm font-medium text-slate-700">Prénom</label>
            <input id="firstname" type="text" required
                   class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-md">
          </div>
          <div>
            <label for="lastname" class="block text-sm font-medium text-slate-700">Nom</label>
            <input id="lastname" type="text" required
                   class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-md">
          </div>
        </div>
        <div class="mt-4">
          <label for="birthdate" class="block text-sm font-medium text-slate-700">Date de naissance</label>
          <input id="birthdate" type="date" required
                 class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-md">
        </div>
      </section>

      <!-- Étape 2 — Coordonnées -->
      <section data-state="step-2" hidden>
        <h2 class="font-medium text-slate-800 mb-3">Étape 2 — Coordonnées</h2>
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
          <input id="email" type="email" required
                 class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-md">
        </div>
        <div class="mt-4">
          <label for="phone" class="block text-sm font-medium text-slate-700">Téléphone</label>
          <input id="phone" type="tel" pattern="^\+?[0-9 .-]{8,}$"
                 class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-md">
        </div>
        <div class="mt-4">
          <label for="address" class="block text-sm font-medium text-slate-700">Adresse</label>
          <textarea id="address" rows="3" required
                    class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-md"></textarea>
        </div>
      </section>

      <!-- Étape 3 — Confirmation -->
      <section data-state="step-3" hidden>
        <h2 class="font-medium text-slate-800 mb-3">Étape 3 — Confirmation</h2>
        <div class="p-4 bg-slate-50 rounded-md text-sm space-y-1">
          <p><strong>Nom :</strong> [Prénom Nom]</p>
          <p><strong>Email :</strong> [email@example.com]</p>
          <p><strong>Téléphone :</strong> [+33 6 12 34 56 78]</p>
        </div>
        <label class="flex items-start mt-4 text-sm text-slate-600">
          <input type="checkbox" required class="mt-0.5 mr-2">
          <span>J'accepte les <a href="/cgu" class="text-blue-600 hover:underline">CGU</a> et la politique de confidentialité.</span>
        </label>
      </section>

      <!-- Navigation -->
      <div class="flex justify-between pt-4 border-t border-slate-200">
        <button type="button"
                class="px-4 py-2 text-slate-700 hover:bg-slate-100 rounded-md disabled:opacity-40">
          ← Précédent
        </button>
        <button type="submit"
                class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md">
          Suivant →
        </button>
      </div>

    </form>
  </main>

</body>
</html>
