<title>Navigation — SIM</title>
<template id="__bundler_thumbnail" data-bg-color="#ffffff" data-om-id="a4ba4675:3"></template>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --ink: #1f1f1f;
    --text: #2b2b2b;
    --muted: #6b6b7a;
    --muted-2: #9a9aa8;
    --line: #e8e8ee;
    --line-2: #f0f0f4;
    --bg: #ffffff;
    --bg-page: #fafbfc;
    --accent: #4f3bd9;
    --accent-2: #3a2bb0;
    --accent-soft: #efeaff;
    --accent-softer: #f6f3ff;
    --avatar: #3f37c9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* TopBar */
  .topbar {
    height: 64px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 36px;
    background: #fff;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    line-height: 1.1;
  }
  .brand .logo {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 35%, #b3e0c8 0 28%, transparent 29%),
      radial-gradient(circle at 70% 65%, #f4c89a 0 28%, transparent 29%),
      linear-gradient(135deg, #c9e8d4, #f4d6b0);
  }
  .brand .name {
    display: flex;
    flex-direction: column;
    font-size: 13px;
  }
  .brand .name span:first-child { color: var(--ink); font-weight: 600; }
  .brand .name span:last-child { color: var(--ink); font-weight: 600; }

  .nav {
    display: flex;
    gap: 28px;
    align-items: center;
    flex: 1;
  }
  .nav a {
    font-size: 14px;
    color: var(--muted);
    text-decoration: none;
    padding: 8px 2px;
    position: relative;
    cursor: pointer;
    font-weight: 400;
  }
  .nav a:hover { color: var(--ink); }
  .nav a.active {
    color: var(--accent);
    font-weight: 500;
  }
  .nav a.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -22px;
    height: 2px;
    background: var(--accent);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .lang-btn:hover { background: var(--accent-softer); }
  .lang-btn .flag-fr {
    width: 18px; height: 13px; border-radius: 1px; overflow: hidden;
    background: linear-gradient(to right, #002395 0 33.3%, #fff 33.3% 66.6%, #ED2939 66.6%);
  }
  .lang-btn .flag-en {
    width: 18px; height: 13px; border-radius: 1px;
    background:
      linear-gradient(45deg, transparent 47%, #fff 47% 53%, transparent 53%),
      linear-gradient(-45deg, transparent 47%, #fff 47% 53%, transparent 53%),
      linear-gradient(45deg, transparent 48.5%, #C8102E 48.5% 51.5%, transparent 51.5%),
      linear-gradient(-45deg, transparent 48.5%, #C8102E 48.5% 51.5%, transparent 51.5%),
      linear-gradient(0deg, transparent 40%, #fff 40% 60%, transparent 60%),
      linear-gradient(90deg, transparent 40%, #fff 40% 60%, transparent 60%),
      linear-gradient(0deg, transparent 45%, #C8102E 45% 55%, transparent 55%),
      linear-gradient(90deg, transparent 45%, #C8102E 45% 55%, transparent 55%),
      #012169;
  }
  .lang-btn .chev { color: var(--muted); }

  .ctx-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    background: transparent;
    border: none;
    font-family: inherit;
    padding: 6px 4px;
  }
  .ctx-btn:hover { color: var(--accent); }
  .ctx-btn .chev { color: var(--muted); }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--avatar);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }

  /* Dropdowns showcase */
  .showcase {
    padding: 60px 28px 80px;
    display: flex;
    gap: 80px;
    align-items: flex-start;
    background: #fff;
  }

  .showcase-block { position: relative; }
  .marker {
    position: absolute;
    top: -28px;
    left: 0;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
  }

  /* Lang dropdown */
  .lang-dd-anchor {
    position: relative;
    display: inline-block;
  }
  .lang-dd {
    position: absolute;
    top: 40px;
    left: 0;
    width: 90px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 8px 24px -6px rgba(20,19,43,0.18);
    overflow: hidden;
  }
  .lang-dd .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  .lang-dd .item:hover { background: var(--accent-softer); }
  .lang-dd .item.active {
    background: var(--accent-soft);
    font-weight: 500;
  }

  /* Context dropdown */
  .ctx-dd-anchor {
    position: relative;
    display: inline-block;
  }
  .ctx-dd {
    position: absolute;
    top: 40px;
    left: 0;
    width: 200px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 8px 24px -6px rgba(20,19,43,0.18);
    overflow: hidden;
    padding: 4px 0;
  }
  .ctx-dd .item {
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  .ctx-dd .item:hover { background: var(--accent-softer); }
  .ctx-dd .item.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
  }

  /* User dropdown */
  .user-dd-anchor {
    position: relative;
    display: inline-block;
  }
  .avatar-stack {
    margin-left: 20px;
  }
  .user-dd {
    position: absolute;
    top: 50px;
    left: -120px;
    width: 180px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 8px 24px -6px rgba(20,19,43,0.18);
    overflow: hidden;
    padding: 6px 0;
  }
  .user-dd .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  .user-dd .item:hover { background: var(--accent-softer); }
  .user-dd .item .ico { color: var(--ink); width: 16px; height: 16px; }
  /* Dropdown anchors in topbar */
  .dd-anchor { position: relative; display: inline-block; }
  .dd-anchor .dd-menu { display: none; }
  .dd-anchor:hover .dd-menu, .dd-anchor:focus-within .dd-menu { display: block; }
  .dd-anchor:hover > .lang-btn { border-color: var(--accent); }

  .lang-dd, .ctx-dd, .user-dd {
    position: absolute;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 8px 24px -6px rgba(20,19,43,0.18);
    overflow: hidden;
    z-index: 50;
  }
  .lang-dd { top: calc(100% + 6px); left: 0; width: 90px; }
  .ctx-dd  { top: calc(100% + 6px); left: 0; width: 200px; padding: 4px 0; }
  .user-dd { top: calc(100% + 6px); right: 0; width: 180px; padding: 6px 0; }

  .lang-dd .item, .ctx-dd .item, .user-dd .item {
    padding: 10px 14px; font-size: 13px; color: var(--ink); cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .lang-dd .item:hover, .ctx-dd .item:hover, .user-dd .item:hover { background: var(--accent-softer); }
  .lang-dd .item.active { background: var(--accent-soft); font-weight: 500; }
  .ctx-dd .item.active  { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .user-dd .item .ico { color: var(--ink); width: 16px; height: 16px; }
</style>
