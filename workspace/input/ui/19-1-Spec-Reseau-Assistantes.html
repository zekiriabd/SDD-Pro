<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo — Assistantes maternelles</title>
<link rel="stylesheet" href="design-system.css">
<style>
  /* ============================================================
     Écran 15 · Liste des assistantes maternelles
     Épuré : recherche texte + filtres (Ma ville / Tout).
     Colonnes : Nom · Prénom · Téléphone · Ville · Code postal.
     Aucun avatar, aucune icône de liste, aucun bouton, aucun badge.
     ============================================================ */
  body { background: var(--nj-gradient-mesh); min-height: 100vh; }

  .canvas {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    gap: 22px; padding: 40px 20px 56px;
  }
  .canvas__head { text-align: center; }
  .canvas__head .eyebrow {
    font-family: var(--nj-font-mono);
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--nj-coral-600);
  }
  .canvas__head h1 {
    font-size: 24px; font-weight: 800; letter-spacing: -0.02em;
    color: var(--nj-ink-900); margin: 8px 0 0;
  }

  /* ---- app shell ---- */
  .app {
    flex: 1; display: flex; flex-direction: column;
    background: var(--nj-cream); overflow: hidden;
  }
  .topbar {
    height: var(--nj-topbar-h); flex-shrink: 0;
    display: flex; align-items: center; gap: 14px; padding: 0 18px;
    background: var(--nj-surface);
    border-bottom: 1px solid var(--nj-line-soft); z-index: 5;
  }
  .topbar__menu {
    width: 40px; height: 40px; border-radius: 999px;
    background: var(--nj-coral-500); color: #fff; border: 0;
    display: grid; place-items: center; box-shadow: var(--nj-shadow-brand); cursor: pointer;
  }
  .topbar__title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--nj-ink-900); }
  .topbar__title em { font-style: normal; color: var(--nj-coral-500); }

  /* ---- search + filters ---- */
  .toolbar {
    padding: 16px 20px 12px;
    display: flex; flex-direction: column; gap: 12px;
    background: var(--nj-surface);
    border-bottom: 1px solid var(--nj-line-soft);
    flex-shrink: 0;
  }
  .search { position: relative; }
  .search > svg {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    color: var(--nj-ink-400); pointer-events: none;
  }
  .search input {
    width: 100%; height: 48px;
    border: 1px solid var(--nj-line); background: var(--nj-cream);
    border-radius: 14px; padding: 0 40px 0 44px;
    font-family: inherit; font-size: 15px; color: var(--nj-ink-900);
    transition: border-color var(--nj-dur-fast), box-shadow var(--nj-dur-fast), background var(--nj-dur-fast);
  }
  .search input::placeholder { color: var(--nj-ink-400); }
  .search input:focus {
    outline: none; background: var(--nj-surface);
    border-color: var(--nj-coral-400);
    box-shadow: 0 0 0 4px oklch(0.93 0.05 8 / 0.7);
  }
  .search__clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border: 0; border-radius: 999px;
    background: var(--nj-line); color: var(--nj-ink-500);
    display: none; place-items: center; cursor: pointer;
  }
  .search.has-val .search__clear { display: grid; }

  /* segmented toggle : Ma ville / Tout */
  .seg {
    display: inline-flex; padding: 4px; gap: 4px;
    background: var(--nj-cream);
    border: 1px solid var(--nj-line);
    border-radius: 999px; align-self: flex-start;
  }
  .seg__btn {
    border: 0; cursor: pointer;
    padding: 8px 18px; border-radius: 999px;
    font-family: inherit; font-size: 13px; font-weight: 700;
    color: var(--nj-ink-500); background: transparent;
    transition: color var(--nj-dur-fast), background var(--nj-dur-fast), box-shadow var(--nj-dur-fast);
  }
  .seg__btn.is-active {
    background: var(--nj-ink-900); color: #fff;
    box-shadow: var(--nj-shadow-sm);
  }

  /* ---- result list (épuré, façon grille) ---- */
  .list { flex: 1; overflow-y: auto; padding: 16px 20px 22px; }
  .grid {
    background: var(--nj-surface);
    border: 1px solid var(--nj-line-soft);
    border-radius: var(--nj-radius-lg);
    box-shadow: var(--nj-shadow-xs);
    overflow: hidden;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 15px 16px;
    transition: background var(--nj-dur-fast);
  }
  .row + .row { border-top: 1px solid var(--nj-line-soft); }
  .row:hover { background: var(--nj-coral-50); }

  .row__id { min-width: 0; }
  .row__name {
    font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
    color: var(--nj-ink-900); line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row__name .last { text-transform: uppercase; letter-spacing: 0.01em; }
  .row__loc {
    margin-top: 3px; font-size: 13px; color: var(--nj-ink-500);
    line-height: 1.35;
  }
  .row__loc .cp { white-space: nowrap; }
  .row__loc .cp { color: var(--nj-ink-400); }
  .row__tel {
    flex-shrink: 0; text-align: right;
    font-family: var(--nj-font-mono); font-size: 14px; font-weight: 500;
    color: var(--nj-ink-700); white-space: nowrap;
  }

  /* empty state */
  .empty {
    text-align: center; padding: 48px 24px; color: var(--nj-ink-500);
    display: none; flex-direction: column; align-items: center; gap: 8px;
  }
  .empty.show { display: flex; }
  .empty b { font-size: 15px; color: var(--nj-ink-900); font-weight: 700; }
  .empty span { font-size: 13px; }

  /* ---- tab bar ---- */
  .tabbar {
    height: var(--nj-tabbar-h); flex-shrink: 0;
    background: var(--nj-surface);
    border-top: 1px solid var(--nj-line-soft);
    display: flex; padding: 0 8px;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    color: var(--nj-ink-500); font-size: 11px; font-weight: 600;
    background: transparent; border: 0; cursor: pointer;
    position: relative; padding-top: 8px;
  }
  .tab .icon { width: 22px; height: 22px; }
  .tab--active { color: var(--nj-coral-600); }
  .tab--active::before {
    content: ''; position: absolute; top: 0;
    width: 32px; height: 3px; background: var(--nj-coral-500);
    border-radius: 0 0 999px 999px;
  }
  .home-indicator {
    height: 8px; display: flex; justify-content: center; align-items: flex-start;
    flex-shrink: 0; background: var(--nj-surface);
  }
  .home-indicator::after {
    content: ''; width: 134px; height: 5px;
    background: var(--nj-ink-900); border-radius: 999px; opacity: 0.92;
  }
</style>
</head>
<body>

<div class="canvas">
  <div class="canvas__head">
    <div class="eyebrow">Écran 15</div>
    <h1>Assistantes maternelles</h1>
  </div>

  <div class="nj-phone">
    <div class="nj-phone__notch"></div>
    <div class="nj-phone__screen">
      <div class="nj-statusbar">
        <span>9:41</span>
        <span class="nj-statusbar__icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.5"/><rect x="4.5" y="5" width="3" height="6" rx="0.5"/><rect x="9" y="3" width="3" height="8" rx="0.5"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 0C4.6 0 1.9 1 0 2.7l1.4 1.5C2.9 2.8 5.1 1.9 7.5 1.9s4.6.9 6.1 2.3L15 2.7C13.1 1 10.4 0 7.5 0z"/></svg>
          <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="18" height="7" rx="1.5" fill="currentColor"/><rect x="22.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor" opacity="0.5"/></svg>
        </span>
      </div>

      <div class="app" data-screen-label="15 Assistantes maternelles">
        <div class="topbar">
          <button class="topbar__menu" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
          <div class="topbar__title">Nounou<em>Job</em></div>
        </div>

        <div class="toolbar">
          <div class="search" id="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="q" placeholder="Rechercher un nom, une ville, un code postal…" aria-label="Rechercher">
            <button class="search__clear" id="clear" aria-label="Effacer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
          <div class="seg" id="seg">
            <button class="seg__btn is-active" data-scope="ville">Ma ville</button>
            <button class="seg__btn" data-scope="tout">Tout</button>
          </div>
        </div>

        <div class="list">
          <div class="grid" id="grid"></div>
          <div class="empty" id="empty">
            <b>Aucun résultat</b>
            <span>Modifiez votre recherche ou changez de filtre.</span>
          </div>
        </div>

        <nav class="tabbar">
          <button class="tab"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg><span>Accueil</span></button>
          <button class="tab tab--active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Réseau</span></button>
          <button class="tab"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Déconnexion</span></button>
        </nav>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Assistante maternelle connectée (sert pour le filtre « Ma ville »)
  const ME = { ville: 'Saint-Germain-en-Laye', cp: '78100' };

  // Base de données (prototype). `dispo` est filtré en coulisse, jamais affiché.
  const NOUNOUS = [
    { prenom: 'Fatima',    nom: 'Cherif',   ville: 'Saint-Germain-en-Laye', cp: '78100', tel: '06 34 56 78 90', dispo: true  },
    { prenom: 'Claire',    nom: 'Fontaine', ville: 'Saint-Germain-en-Laye', cp: '78100', tel: '06 22 33 44 55', dispo: true  },
    { prenom: 'Martine',   nom: 'Girard',   ville: 'Saint-Germain-en-Laye', cp: '78100', tel: '06 11 22 33 44', dispo: true  },
    { prenom: 'Aïcha',     nom: 'Moreau',   ville: 'Saint-Germain-en-Laye', cp: '78100', tel: '06 33 44 55 66', dispo: false },
    { prenom: 'Karima',    nom: 'Benali',   ville: 'Versailles',            cp: '78000', tel: '06 12 34 56 78', dispo: true  },
    { prenom: 'Sophie',    nom: 'Marchand', ville: 'Le Vésinet',            cp: '78110', tel: '06 23 45 67 89', dispo: true  },
    { prenom: 'Awa',       nom: 'Diallo',   ville: 'Sartrouville',          cp: '78500', tel: '06 56 78 90 12', dispo: true  },
    { prenom: 'Nathalie',  nom: 'Dubois',   ville: 'Poissy',                cp: '78300', tel: '06 45 67 89 01', dispo: false },
    { prenom: 'Christine', nom: 'Robert',   ville: 'Maisons-Laffitte',      cp: '78600', tel: '06 67 89 01 23', dispo: true  },
    { prenom: 'Leïla',     nom: 'Hamadi',   ville: 'Chatou',                cp: '78400', tel: '06 78 90 12 34', dispo: true  },
    { prenom: 'Sandrine',  nom: 'Petit',    ville: 'Conflans-Ste-Honorine', cp: '78700', tel: '06 89 01 23 45', dispo: true  },
    { prenom: 'Yamina',    nom: 'Saïdi',    ville: 'Houilles',              cp: '78800', tel: '06 90 12 34 56', dispo: true  }
  ];

  const norm = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  const state = { q: '', scope: 'ville' }; // « Ma ville » sélectionné par défaut

  const grid   = document.getElementById('grid');
  const empty  = document.getElementById('empty');
  const input  = document.getElementById('q');
  const search = document.getElementById('search');

  function compute() {
    return NOUNOUS.filter(n => {
      if (!n.dispo) return false;                          // disponibilité = true (coulisse)
      if (state.scope === 'ville' && n.cp !== ME.cp) return false;
      if (state.q) {                                       // recherche : nom, prénom, ville, code postal
        const t = norm(`${n.prenom} ${n.nom} ${n.ville} ${n.cp}`);
        if (!norm(state.q).split(/\s+/).every(w => t.includes(w))) return false;
      }
      return true;
    });
  }

  function render() {
    const items = compute();
    grid.innerHTML = items.map(n => `
      <div class="row">
        <div class="row__id">
          <div class="row__name">${n.prenom} <span class="last">${n.nom}</span></div>
          <div class="row__loc">${n.ville} <span class="cp">· ${n.cp}</span></div>
        </div>
        <div class="row__tel">${n.tel}</div>
      </div>`).join('');
    grid.style.display = items.length ? '' : 'none';
    empty.classList.toggle('show', items.length === 0);
  }

  input.addEventListener('input', () => {
    state.q = input.value;
    search.classList.toggle('has-val', !!input.value);
    render();
  });
  document.getElementById('clear').addEventListener('click', () => {
    input.value = ''; state.q = ''; search.classList.remove('has-val'); render(); input.focus();
  });
  document.getElementById('seg').addEventListener('click', (e) => {
    const btn = e.target.closest('.seg__btn');
    if (!btn) return;
    document.querySelectorAll('.seg__btn').forEach(b => b.classList.remove('is-active'));
    btn.classList.add('is-active');
    state.scope = btn.dataset.scope;
    render();
  });

  render();
</script>

</body>
</html>
