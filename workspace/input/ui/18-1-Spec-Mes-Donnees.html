<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo — Mes données</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  .app {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--nj-cream);
  }

  /* top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 16px 12px;
    flex-shrink: 0;
  }
  .topbar__back {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border: 0;
    border-radius: var(--nj-radius-md);
    background: var(--nj-surface);
    color: var(--nj-ink-700);
    box-shadow: var(--nj-shadow-xs);
    cursor: pointer;
    text-decoration: none;
  }
  .topbar__title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .topbar__title em { font-style: normal; color: var(--nj-coral-600); }

  /* scroll form */
  .form-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 6px 20px 0;
    -webkit-overflow-scrolling: touch;
  }

  /* avatar */
  .avatar-edit {
    display: flex;
    justify-content: center;
    margin: 6px 0 22px;
  }
  .avatar-edit__ring {
    position: relative;
    width: 116px; height: 116px;
  }
  .avatar-edit__img {
    width: 116px; height: 116px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 30%;
    border: 4px solid var(--nj-surface);
    box-shadow: var(--nj-shadow-md);
    display: block;
  }
  .avatar-edit__cam {
    position: absolute;
    right: 2px; bottom: 2px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid var(--nj-surface);
    background: var(--nj-coral-500);
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: var(--nj-shadow-sm);
  }
  .avatar-edit__cam .material-symbols-outlined { font-size: 18px; }

  /* fields */
  .form-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 16px;
  }
  .field { position: relative; }
  .field input {
    width: 100%;
    height: 56px;
    padding: 0 18px;
    border: 1.5px solid var(--nj-coral-200);
    border-radius: var(--nj-radius-lg);
    background: var(--nj-surface);
    font-family: var(--nj-font-sans);
    font-size: 15px;
    font-weight: 500;
    color: var(--nj-ink-900);
    outline: none;
    box-shadow: var(--nj-shadow-xs);
    transition: border-color var(--nj-dur-fast), box-shadow var(--nj-dur-fast);
  }
  .field input::placeholder { color: var(--nj-ink-400); font-weight: 400; }
  .field input:focus {
    border-color: var(--nj-coral-400);
    box-shadow: 0 0 0 4px oklch(0.93 0.05 8 / 0.7);
  }
  .field input[type="date"] {
    color: var(--nj-ink-900);
    appearance: none;
  }
  .field input[type="date"]::-webkit-calendar-picker-indicator {
    opacity: 0.55;
    cursor: pointer;
  }
  /* date shows placeholder-ish grey when empty (value jj/mm/aaaa) */
  .field input.is-empty { color: var(--nj-ink-400); }

  /* floating label for date fields (date inputs can't use placeholder) */
  .field--labeled { position: relative; }
  .field--labeled input {
    height: 64px;
    padding-top: 22px;
  }
  .field--labeled .field__label {
    position: absolute;
    left: 19px;
    top: 11px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--nj-ink-500);
    pointer-events: none;
  }

  /* save bar */
  .save-bar {
    flex-shrink: 0;
    padding: 12px 20px 18px;
    background: linear-gradient(to top, var(--nj-cream) 70%, transparent);
  }
  .btn-save {
    width: 100%;
    height: 56px;
    border: 0;
    border-radius: var(--nj-radius-pill);
    background: var(--nj-gradient-vivid);
    color: #fff;
    font-family: var(--nj-font-sans);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: var(--nj-shadow-brand);
    transition: transform var(--nj-dur-fast), box-shadow var(--nj-dur-fast);
  }
  .btn-save:hover { transform: translateY(-1px); box-shadow: 0 18px 36px oklch(0.760 0.120 2 / 0.40); }
  .btn-save:active { transform: scale(0.99); }

  .home-indicator {
    height: 20px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: var(--nj-cream);
  }
  .home-indicator::after {
    content: "";
    width: 130px; height: 5px;
    border-radius: 999px;
    background: var(--nj-ink-900);
    opacity: 0.22;
  }
</style>
</head>
<body>

<div class="nj-stage">
  <div class="nj-phone">
    <div class="nj-phone__notch"></div>
    <div class="nj-phone__screen">

      <!-- iOS status bar -->
      <div class="nj-statusbar">
        <span>9:41</span>
        <span class="nj-statusbar__icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0.5"/><rect x="4.5" y="5" width="3" height="6" rx="0.5"/><rect x="9" y="3" width="3" height="8" rx="0.5"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 0C4.6 0 1.9 1 0 2.7l1.4 1.5C2.9 2.8 5.1 1.9 7.5 1.9s4.6.9 6.1 2.3L15 2.7C13.1 1 10.4 0 7.5 0zm0 3.7c-2 0-3.7.7-5.1 1.9l1.4 1.4c1-.9 2.3-1.4 3.7-1.4s2.7.5 3.7 1.4L12.6 5.6C11.2 4.4 9.5 3.7 7.5 3.7zm0 3.7c-1.1 0-2 .4-2.7 1l2.7 2.6 2.7-2.6c-.7-.6-1.6-1-2.7-1z"/></svg>
          <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="18" height="7" rx="1.5" fill="currentColor"/><rect x="22.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor" opacity="0.5"/></svg>
        </span>
      </div>

      <div class="app" data-screen-label="14 Mes données">

        <!-- top bar -->
        <div class="topbar">
          <a class="topbar__back" href="01-menu-principal.html" aria-label="Retour">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
          </a>
          <div class="topbar__title">Mes données</div>
        </div>

        <form class="form-scroll" onsubmit="return false">

          <div class="avatar-edit">
            <div class="avatar-edit__ring">
              <img class="avatar-edit__img" src="assets/avatar-demo-user.png" alt="Photo de profil">
              <button type="button" class="avatar-edit__cam" aria-label="Changer la photo">
                <span class="material-symbols-outlined">photo_camera</span>
              </button>
            </div>
          </div>

          <div class="form-list">
            <div class="field"><input type="text" value="Maintainer" aria-label="Nom" placeholder="Nom"></div>
            <div class="field"><input type="text" value="Demo User" aria-label="Prénom" placeholder="Prénom"></div>
            <div class="field"><input type="text" value="" aria-label="Nom de jeune fille" placeholder="Nom de jeune fille"></div>
            <div class="field field--labeled"><span class="field__label">Date de naissance</span><input type="date" value="1975-08-18" aria-label="Date de naissance"></div>
            <div class="field"><input type="text" value="" aria-label="Lieu de naissance — Pays" placeholder="Lieu de naissance — Pays"></div>
            <div class="field"><input type="text" value="" aria-label="Lieu de naissance — Département" placeholder="Lieu de naissance — Département"></div>
            <div class="field"><input type="text" value="Biskra" aria-label="Lieu de naissance — Ville" placeholder="Lieu de naissance — Ville"></div>
            <div class="field"><input type="text" value="19 rue saint leger" aria-label="Rue" placeholder="Rue"></div>
            <div class="field"><input type="text" inputmode="numeric" value="78100" aria-label="Code postal" placeholder="Code postal"></div>
            <div class="field"><input type="text" value="Saint germain enlaye" aria-label="Ville" placeholder="Ville"></div>
            <div class="field"><input type="tel" value="123456789" aria-label="Téléphone" placeholder="Téléphone"></div>
            <div class="field"><input type="email" value="" aria-label="Email" placeholder="Email"></div>
            <div class="field"><input type="text" inputmode="numeric" value="" aria-label="Numéro de sécurité sociale" placeholder="Numéro de sécurité sociale"></div>
            <div class="field field--labeled"><span class="field__label">Date de début d'agrément</span><input type="date" class="is-empty" value="" aria-label="Date de début d'agrément"></div>
            <div class="field field--labeled"><span class="field__label">Date de dernier renouvellement</span><input type="date" class="is-empty" value="" aria-label="Date de dernier renouvellement"></div>
            <div class="field"><input type="text" inputmode="numeric" value="123654789" aria-label="Assurance pro — Numéro" placeholder="Assurance pro — Numéro"></div>
            <div class="field"><input type="text" value="" aria-label="Assurance pro — Compagnie" placeholder="Assurance pro — Compagnie"></div>
          </div>

        </form>

        <div class="save-bar">
          <button class="btn-save" type="button">Enregistrer</button>
        </div>

        <div class="home-indicator"></div>
      </div>

    </div>
  </div>
</div>

<script>
  // grey out empty date input like a placeholder
  document.querySelectorAll('input[type="date"]').forEach(function (el) {
    function sync() { el.classList.toggle('is-empty', !el.value); }
    el.addEventListener('input', sync);
    el.addEventListener('change', sync);
    sync();
  });
</script>
</body>
</html>
