<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Menu campagne — CMS Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ec3a7a;
    --pink-deep:#d3296a;
    --pink-light:#fbd4e2;
    --pink-disabled:#f7c8d9;
    --text:#1f2433;
    --text-2:#3a4054;
    --text-muted:#6b7280;
    --text-faint:#a0a4ae;
    --border:#e7e9ef;
    --border-2:#d6d9e0;
    --bg:#ffffff;
    --bg-soft:#f6f7fa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#f4f5f8;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  .submenu{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:14px 24px;
    background:#fff;
    border-bottom:1px solid var(--border);
    box-shadow:0 1px 2px rgba(20,24,40,.02);
  }

  /* Buttons */
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    height:40px;
    padding:0 18px;
    border-radius:10px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    color:var(--text);
    background:#fff;
    border:1px solid var(--border);
    cursor:pointer;
    transition:background .15s,border-color .15s,color .15s,opacity .15s;
    white-space:nowrap;
  }
  .btn:hover{background:var(--bg-soft);}
  .btn .ic{display:inline-flex;color:var(--text);}

  .btn-primary{
    background:var(--pink);
    color:#fff;
    border-color:var(--pink);
  }
  .btn-primary:hover{background:var(--pink-deep);border-color:var(--pink-deep);}
  .btn-primary[disabled],
  .btn-primary.is-disabled{
    background:var(--pink-disabled);
    border-color:var(--pink-disabled);
    color:#fff;
    cursor:not-allowed;
  }
  .btn-primary[disabled]:hover,
  .btn-primary.is-disabled:hover{
    background:var(--pink-disabled);
    border-color:var(--pink-disabled);
  }

  /* Stepper */
  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    flex:0 1 auto;
  }
  .step{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:0 4px;
  }
  .step .num{
    width:26px;height:26px;
    border-radius:7px;
    display:grid;place-items:center;
    font-size:12.5px;font-weight:700;
    background:#f1f2f6;
    color:var(--text-faint);
    border:1px solid var(--border);
    flex:0 0 auto;
  }
  .step .label{
    font-size:13px;
    font-weight:500;
    color:var(--text-faint);
    letter-spacing:-.005em;
  }
  .step.active .num{
    background:#1f2433;
    color:#fff;
    border-color:#1f2433;
  }
  .step.active .label{
    color:var(--text);
    font-weight:600;
  }
  .step.done .num{
    background:var(--pink);
    color:#fff;
    border-color:var(--pink);
  }
  .step.done .label{color:var(--text);}

  .connector{
    width:48px;
    height:1px;
    background:var(--border-2);
    margin:0 8px;
    flex:0 0 auto;
  }

  /* Right side */
  .right{
    display:flex;
    align-items:center;
    gap:12px;
  }

  /* Demo body */
  .demo{
    padding:40px 24px;
    color:var(--text-muted);
    font-size:13px;
  }

  @media (max-width: 1100px){
    .connector{width:24px;margin:0 4px;}
    .submenu{gap:12px;padding:12px 16px;}
  }
  @media (max-width: 860px){
    .step .label{display:none;}
    .connector{width:14px;}
  }
</style>
</head>
<body>

<nav class="submenu" aria-label="Étapes création de campagne">
  <button class="btn" type="button">
    <span class="ic" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    </span>
    Sauvegarder et quitter
  </button>

  <ol class="stepper" role="list">
    <li class="step active">
      <span class="num">1</span>
      <span class="label">Informations générales</span>
    </li>
    <span class="connector" aria-hidden="true"></span>
    <li class="step">
      <span class="num">2</span>
      <span class="label">Périmètre</span>
    </li>
    <span class="connector" aria-hidden="true"></span>
    <li class="step">
      <span class="num">3</span>
      <span class="label">Contenus</span>
    </li>
    <span class="connector" aria-hidden="true"></span>
    <li class="step">
      <span class="num">4</span>
      <span class="label">Récapitulatif</span>
    </li>
  </ol>

  <div class="right">
    <button class="btn" type="button">
      <span class="ic" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </span>
      Retour
    </button>
    <button class="btn btn-primary is-disabled" type="button" disabled>Suivant</button>
  </div>
</nav>

<div class="demo">Menu campagne — barre d'étapes</div>

</body>
</html>
