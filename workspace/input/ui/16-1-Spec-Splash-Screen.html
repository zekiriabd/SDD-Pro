<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo — Splash</title>
<link rel="stylesheet" href="design-system.css">
<style>
  .nj-stage { background: var(--nj-cream); }

  /* ---- Splash screen ---- */
  .splash {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    background:
      radial-gradient(120% 90% at 20% 0%, oklch(0.93 0.07 5 / 0.95), transparent 55%),
      radial-gradient(120% 90% at 100% 100%, oklch(0.86 0.10 292 / 0.95), transparent 55%),
      linear-gradient(150deg, oklch(0.90 0.075 350) 0%, oklch(0.80 0.105 292) 100%);
    overflow: hidden;
  }

  /* soft floating bubbles */
  .splash__bubble {
    position: absolute;
    border-radius: 50%;
    background: oklch(1 0 0 / 0.18);
    animation: floaty 5s ease-in-out infinite;
  }
  .splash__bubble--1 { width: 120px; height: 120px; top: 12%; right: -30px; animation-delay: .2s; }
  .splash__bubble--2 { width: 70px;  height: 70px;  bottom: 16%; left: -18px; animation-delay: 1.1s; }
  .splash__bubble--3 { width: 36px;  height: 36px;  top: 24%;  left: 14%;  animation-delay: .6s; }
  @keyframes floaty {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-14px); }
  }

  /* logo mark — drawn-on line art */
  .splash__mark {
    width: 168px;
    height: 168px;
    display: block;
    filter: drop-shadow(0 12px 28px oklch(0.42 0.12 295 / 0.35));
  }
  .splash__mark .stroke {
    fill: none;
    stroke: #ffffff;
    stroke-width: 5.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: draw .9s cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }
  .splash__mark .fillsoft {
    fill: oklch(1 0 0 / 0.16);
    opacity: 0;
    animation: softfill .5s ease forwards .85s;
  }
  .splash__mark .dot {
    fill: #ffffff;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: pop .35s var(--nj-ease) forwards;
  }
  @keyframes draw   { to { stroke-dashoffset: 0; } }
  @keyframes softfill { to { opacity: 1; } }
  @keyframes pop    { 0% { opacity: 0; transform: scale(0); } 70% { transform: scale(1.25); } 100% { opacity: 1; transform: scale(1); } }

  /* wordmark */
  .splash__word {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    opacity: 0;
    transform: translateY(14px);
    animation: rise .6s var(--nj-ease) forwards .85s;
  }
  .splash__title {
    font-family: var(--nj-font-sans);
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -0.02em;
    color: #ffffff;
    line-height: 1;
  }
  .splash__sub {
    font-family: var(--nj-font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: oklch(1 0 0 / 0.82);
    padding-left: 0.34em;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  /* loader dots */
  .splash__loader {
    position: absolute;
    bottom: 64px;
    display: flex;
    gap: 7px;
    opacity: 0;
    animation: rise .5s ease forwards 1.3s;
  }
  .splash__loader i {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: oklch(1 0 0 / 0.7);
    animation: blink 1s ease-in-out infinite;
  }
  .splash__loader i:nth-child(2) { animation-delay: .15s; }
  .splash__loader i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%,100% { opacity: .35; transform: scale(.8);} 50% { opacity: 1; transform: scale(1);} }

  /* whole splash exits, app peeks underneath */
  .splash {
    animation: splashout .5s var(--nj-ease) forwards 2s;
  }
  @keyframes splashout {
    to { opacity: 0; visibility: hidden; transform: scale(1.04); }
  }

  /* minimal app shell revealed behind */
  .app-peek {
    position: absolute;
    inset: 0;
    background: var(--nj-cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--nj-ink-500);
    font-family: var(--nj-font-sans);
  }
  .app-peek__logo {
    width: 56px; height: 56px;
    display: grid; place-items: center;
    border-radius: 18px;
    background: var(--nj-gradient-vivid);
    color: #fff;
  }
  .app-peek__hint { font-size: 14px; }
  .app-peek__hint a { color: var(--nj-blush-600); font-weight: 700; text-decoration: none; }

  /* replay control (outside the phone, dev convenience) */
  .replay {
    position: fixed;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border: 0;
    border-radius: 999px;
    background: var(--nj-surface);
    color: var(--nj-ink-700);
    font-family: var(--nj-font-sans);
    font-weight: 600;
    font-size: 13px;
    box-shadow: var(--nj-shadow-md);
    cursor: pointer;
  }
  .replay:hover { color: var(--nj-blush-600); }
</style>
</head>
<body>
<div class="nj-stage">
  <div class="nj-phone">
    <div class="nj-phone__notch"></div>
    <div class="nj-phone__screen" id="screen">

      <!-- app revealed behind the splash -->
      <div class="app-peek">
        <div class="app-peek__logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V7a3 3 0 0 1 6 0v4"/><rect x="5" y="11" width="14" height="10" rx="2"/></svg>
        </div>
        <div class="app-peek__hint">Bienvenue · <a href="03-connexion.html">Connexion</a></div>
      </div>

      <!-- SPLASH -->
      <div class="splash" id="splash">
        <span class="splash__bubble splash__bubble--1"></span>
        <span class="splash__bubble splash__bubble--2"></span>
        <span class="splash__bubble splash__bubble--3"></span>

        <svg class="splash__mark" viewBox="0 0 120 120" id="mark">
          <!-- mother head -->
          <circle class="stroke" cx="44" cy="30" r="13" style="--len:82"/>
          <!-- hair bun -->
          <circle class="stroke" cx="33" cy="20" r="5.5" style="--len:35"/>
          <!-- mother body / shoulders -->
          <path class="stroke" d="M28 84 C 28 60, 33 49, 44 49 C 55 49, 60 60, 60 78" style="--len:78"/>
          <!-- arm cradling baby -->
          <path class="stroke" d="M58 64 C 70 60, 76 66, 78 74" style="--len:30"/>
          <!-- baby head -->
          <circle class="stroke" cx="78" cy="64" r="8" style="--len:51"/>
          <!-- baby blanket -->
          <path class="stroke" d="M70 78 C 73 70, 85 70, 88 78 Z" style="--len:40"/>
          <!-- pram body -->
          <path class="stroke" d="M30 92 L 84 92 C 88 92, 90 88, 88 84 L 80 84" style="--len:78"/>
          <!-- pram hood -->
          <path class="stroke" d="M30 92 C 26 70, 44 64, 56 78 L 56 92" style="--len:70"/>
          <!-- pram handle -->
          <path class="stroke" d="M30 92 L 22 80" style="--len:16"/>
          <!-- wheels -->
          <circle class="stroke" cx="40" cy="102" r="6.5" style="--len:41"/>
          <circle class="stroke" cx="78" cy="102" r="6.5" style="--len:41"/>
          <!-- little eyes pop -->
          <circle class="dot" cx="42" cy="29" r="1.9" style="animation-delay:.95s"/>
          <circle class="dot" cx="49" cy="29" r="1.9" style="animation-delay:1.02s"/>
          <circle class="dot" cx="80" cy="63" r="1.6" style="animation-delay:1.1s"/>
        </svg>

        <div class="splash__word">
          <div class="splash__title">Demo</div>
          <div class="splash__sub">Assistantes maternelles</div>
        </div>

        <div class="splash__loader"><i></i><i></i><i></i></div>
      </div>

    </div>
  </div>
</div>

<button class="replay" id="replay">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
  Rejouer
</button>

<script>
  const replay = document.getElementById('replay');
  const screen = document.getElementById('screen');
  replay.addEventListener('click', () => {
    const old = document.getElementById('splash');
    const clone = old.cloneNode(true);
    old.remove();
    screen.appendChild(clone);
    // force reflow to restart all CSS animations
    void clone.offsetWidth;
  });
</script>
</body>
</html>
