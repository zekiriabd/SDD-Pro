## Règles de cette commande

- **Autonome** ; **preflight obligatoire** avant tout spawn.
- **Parallélisme borné** : un batch = un seul message `Agent` parallèle ≤
  `max_parallel` ; batch `i+1` après la fin de `i`. Borne dure : hook.
- **Aucun spawn pour une phase désactivée** (desktop/mobile sans backend :
  0 `dev-backend`, 0 `dev-backend:plan`, 0 API gate).
- **Pas de modification** des US, mockups ou stack ; **erreur isolée par US** ;
  familles séparées (dev-backend ↛ stacks front/ui, dev-frontend ↛ stacks backend).
- Prompts : toujours `FEAT {n}` / `US {n}-{m}` (`enforce_phase_order` refuse sinon).

