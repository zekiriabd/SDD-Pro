# loader.reverse.yml — Reverse engineering manifest (D4 autonomous)
#
# Mirror format of loader.yml but isolated. Discovered via frontmatter
# `loader: .sdd/loader.reverse.yml` in the 12 reverse commands and the
# starting-a-reverse-eng skill. NEVER referenced by loader.yml.
#
# ADV-17 closure: reverse-tech-auditor.writes points to db-schema.enrichment.json
# (NOT db-schema.json — base file is intouchable by Phase 2 agents).
#
# See .sdd/docs/reverse-engineering-workflow.md §7 for the full design.

schemaVersion: 1
manifestType: reverse-engineering
extends: null   # autonomous, does NOT inherit from loader.yml

agents:

  reverse-inventory:
    model_tier: balanced
    phase: 1
    reads:
      - workspace/old/{P}/**                                   # recursive scan
      - .sdd/python/sdd_reverse/language_signatures.yml
      - workspace/old/{P}/.sys/inventory.json                  # for U-N stability across re-runs
    writes:
      - workspace/old/{P}/.sys/inventory.md                    # enriched FR (agent)
    delegated_to:
      - .sdd/python/sdd_reverse_scripts/reverse_inventory.py   # writes inventory/db-schema/language/code-graph (atomic)
      # L0: also writes code-graph.json (symbol-level class graph + roles),
      # and units[] now carry classes[] + seedEvidenceFiles + transitive evidenceFiles.
      # L1: also writes data-access.json (inline SQL + stored procs + params),
      # config.json (connection strings, masked secrets), dependencies.json
      # (full NuGet/.csproj/PackageReference + assembly refs + bin DLLs).
      # units[] now also carry dataAccess{queries, storedProcedureCalls}.

  reverse-tech-auditor:
    model_tier: balanced
    phase: 2
    optional: true
    available_from: v0.2.0   # V2 — implemented
    reads:
      - workspace/old/{P}/.sys/inventory.json
      - workspace/old/{P}/.sys/db-schema.json
      - workspace/old/{P}/.sys/deps-graph.json                  # produced by reverse_audit.py
      - workspace/old/{P}/**                                    # selective on entry points + config + SQL
    writes:
      - workspace/old/{P}/.sys/tech-audit.md
      - workspace/old/{P}/.sys/db-schema.enrichment.json        # ADV-3 + ADV-17 : SEPARATE file, never db-schema.json
    # NOTE ADV-17: this manifest forbids writing to db-schema.json by reverse-tech-auditor.
    # Union base+enrichment is performed by the deterministic script
    # sdd_reverse.merge_db_schema (writes db-schema.merged.json).
    # deps-graph.json is produced by deterministic script reverse_audit.py, not the agent.

  reverse-tech-analyst:
    model_tier: deep       # DEFAULT (complex units). Routed to claude-sonnet-4-6 for `simple` units by /sdd-reverse-analyze (ADR governance-reverse-complexity-ladder, classifier sdd_reverse/code_unit_complexity.py). Structure unchanged — model-only routing.
    phase: 3a
    available_from: v0.7.0       # ADR governance-major-reverse-spec-ladder — barreau bas de l'escalier
    reads:
      - workspace/old/{P}/.sys/inventory.json                   # units[U-N].classes (L0 role map) + evidenceFiles + dataAccess
      - workspace/old/{P}/.sys/db-schema.merged.json            # if present (Phase 2 ran)
      - workspace/old/{P}/.sys/db-schema.json                   # base fallback
      - workspace/old/{P}/.sys/tech-audit.md                    # optional
      - workspace/old/{P}/{evidenceFiles}                       # strict — incl. transitive deep layer (L0)
      - .sdd/python/sdd_reverse/language_signatures.yml
      - .sdd/python/sdd_reverse/analysis.reverse.template.md # isolated tech-analysis template (D5)
    writes:
      - workspace/plans/{n}-{Name}.analysis.md           # tech-analysis output (distinct ext from forward .back/.front)
      - workspace/old/{P}/.sys/modules/{Module}/extraction.md   # extraction log
      - workspace/old/{P}/.sys/inventory.json                   # _featAllocations + _allocatedNames (legacy mode only — 3a owns allocation)

  reverse-us-writer:
    model_tier: balanced     # 3b = altitude-lift sur l'analyse 3a (forbidden_reads sur le code legacy) → Sonnet suffit, -33% coût Opus reverse (audit 2026-06-11). 3a/3c restent Opus.
    phase: 3b
    available_from: v0.7.0       # ADR governance-major-reverse-spec-ladder — barreau moyen
    reads:
      - workspace/plans/{n}-{Name}.analysis.md          # 3a tech-analysis (SOLE content source)
      - workspace/old/{P}/.sys/inventory.json                  # units[U-N] metadata (kind, roles, allocation) — NOT new content
      - .sdd/python/sdd_reverse/us.reverse.template.md
    writes:
      - workspace/us/{n}-{m}-{Name}.md                  # user stories (1 per capability)
      - workspace/old/{P}/.sys/modules/{Module}/stories-3b.md  # decision log
    forbidden_reads:
      - workspace/old/{P}/{evidenceFiles}                      # 3b NEVER reads legacy code — only the 3a analysis

  reverse-feat-composer:
    model_tier: deep       # DEFAULT (complex units). Routed to claude-sonnet-4-6 for `simple` units by /sdd-reverse-feat (ADR governance-reverse-complexity-ladder, same classifier as 3a → class stable across the ladder).
    phase: 3c
    available_from: v0.7.0       # ADR governance-major-reverse-spec-ladder — barreau haut (remplace reverse-functional-extractor, décommissionné D2)
    reads:
      - workspace/us/{n}-{m}-{Name}.md                  # 3b user stories (SOLE content source)
      - workspace/plans/{n}-{Name}.analysis.md          # 3a tech-analysis (evidence resolution + plumbing to demote)
      - workspace/old/{P}/.sys/inventory.json                  # units[U-N] metadata (kind, dataAccess, allocation)
      - .sdd/python/sdd_reverse/language_signatures.yml
      - .sdd/python/sdd_reverse/feat.reverse.template.md    # ADV-9 isolated template (reused)
    writes:
      - workspace/feats/{n}-{Name}.md                    # the FEAT output (business altitude, plumbing demoted)
      - workspace/old/{P}/.sys/modules/{Module}/feat-3c.md     # composition log
    forbidden_reads:
      - workspace/old/{P}/{evidenceFiles}                      # 3c NEVER reads legacy code — only US 3b + analysis 3a

  reverse-completeness-reviewer:
    model_tier: balanced
    phase: "3-review"
    optional: true
    available_from: v0.5.0       # L5 — back-side completeness review (informational)
    reads:
      - workspace/old/{P}/.sys/inventory.json                   # units[U-N].classes + dataAccess
      - workspace/feats/{n}-{Name}.md                     # the FEAT under review
      - workspace/old/{P}/{evidenceFiles}                       # strict, to judge gaps
    writes:
      - workspace/old/{P}/.sys/modules/{Module}/completeness-review.md
    delegated_to:
      - .sdd/python/sdd_reverse_scripts/check_feat_completeness.py     # deterministic gap engine
      - .sdd/python/sdd_reverse_scripts/check_ladder_traceability.py   # D3 ladder traceability (ADR reverse-spec-ladder)

  reverse-ui-extractor:
    model_tier: deep
    phase: 4
    optional: true
    available_from: v0.2.0     # V2 — implemented
    reads:
      - workspace/old/{P}/.sys/inventory.json
      - workspace/old/{P}/{templateFiles, cssFiles}             # selective, ≤ 15 files
      - workspace/feats/{n}-{Name}.md                     # the FEAT produced Phase 3
    writes:
      - workspace/ui/{n}-{m}-{Name}.html

  reverse-parity-inspector:
    model_tier: balanced
    phase: "3.8"
    optional: true
    available_from: v0.9.0     # emprunt Reversa (Inspector) — audit comparatif 2026-06-12
    reads:
      - workspace/feats/{n}-{Name}.md                     # FEAT reverse (SOLE behavioral source)
      - workspace/us/{n}-{m}-{Name}.md                   # US 3b (scenario granularity)
      - workspace/plans/{n}-{Name}.analysis.md           # 3a (evidence resolution only)
      - .sdd/python/sdd_reverse/parity.reverse.template.feature
    writes:
      - workspace/parity/feat-{n}/{m}-{Slug}.feature
      - workspace/parity/feat-{n}/parity-map.md
    forbidden_reads:
      - workspace/old/{P}/**                                    # NEVER reads legacy code (altitude FEAT/US)
    delegated_to:
      - .sdd/python/sdd_reverse_scripts/validate_parity_features.py   # deterministic Gherkin gate

  reverse-paradigm-advisor:
    model_tier: balanced
    phase: "2.7"
    optional: true
    available_from: v0.9.0     # emprunt Reversa (Paradigm Advisor + Curator) — audit comparatif 2026-06-12
    reads:
      - workspace/old/{P}/.sys/inventory.json
      - workspace/old/{P}/.sys/tech-audit.md                    # optional (Phase 2)
      - workspace/old/{P}/.sys/deps-graph.json                  # optional (Phase 2) — orphan signal for DISCARD
      - workspace/stack/stack.md                          # target stack paradigm
      - .sdd/python/sdd_reverse/language_signatures.yml
      - workspace/old/{P}/{evidenceFiles}                       # ≤ 10 example files, file:line citations only
    writes:
      - workspace/old/{P}/.sys/paradigm-decision.md
      - workspace/old/{P}/.sys/curation.md

  reverse-clarifier:
    model_tier: balanced
    phase: "3.9"
    optional: true
    available_from: v0.9.0     # emprunt Reversa (questions.md interactif) — audit comparatif 2026-06-12
    reads:
      - workspace/old/{P}/.sys/inventory.json
      - workspace/old/{P}/.sys/modules/{Module}/completeness-review.md
      - workspace/old/{P}/.sys/curation.md                      # optional (Phase 2.7)
      - workspace/parity/feat-{n}/parity-map.md       # optional (Phase 3.8)
      - workspace/feats/{n}-{Name}.md                     # items medium/low + ingest target
      - workspace/old/{P}/.sys/questions.md                     # Q-N stability + answers (--ingest)
      - .sdd/python/sdd_reverse/questions.reverse.template.md
    writes:
      - workspace/old/{P}/.sys/questions.md
      - workspace/feats/{n}-{Name}.md                     # --ingest ONLY (human-validated patching, §10 resync)
    forbidden_reads:
      - workspace/old/{P}/{evidenceFiles}                       # never re-reads legacy code — gaps come from reports
    delegated_to:
      - .sdd/python/sdd_reverse_scripts/check_ladder_traceability.py   # gap collection (generate)
      - .sdd/python/sdd_reverse_scripts/validate_reverse_feat.py       # post-ingest revalidation

  reverse-sql-analyst:
    model_tier: deep
    phase: "proc-1"
    optional: true
    available_from: v1.0.0       # stored-procedure reverse — DB live READ-ONLY → US (1 proc = 1 US)
    reads:
      - workspace/old/{P}/.sys/inventory.json                    # units = modules (source: db-reverse)
      - workspace/old/{P}/.sys/proc-snapshot/{schema}.{proc}.sql # READ-ONLY body snapshot (Phase 1)
      - workspace/old/{P}/.sys/db-introspection.json             # deterministic signals (no secret)
      - .sdd/python/sdd_reverse/us.proc.reverse.template.md
      - .sdd/python/sdd_reverse/language_signatures.yml
    writes:
      - workspace/us/{n}-{m}-{Name}.md                    # 1 user story per stored procedure
    delegated_to:
      - .sdd/python/sdd_reverse_scripts/reverse_proc_introspect.py  # Phase 1 read-only introspection
    # READ-ONLY: the analyst NEVER connects to or executes against the live
    # database — it reads only the .sys/proc-snapshot/*.sql bodies that Phase 1
    # extracted via SELECT-only catalog queries (readonly_guard).

  reverse-sql-feat-composer:
    model_tier: deep
    phase: "proc-2"
    optional: true              # OPT-IN rung 2 (SDD_REVERSE_FEAT_LLM=1) — default = build_proc_feats.py (0 token)
    available_from: v1.1.0      # 2026-07-24 — LLM module-FEAT composer, parity with code ladder 3c
    reads:
      - workspace/old/{P}/.sys/inventory.json                    # module metadata + _featAllocations
      - workspace/us/{n}-{m}-{Name}.md                           # the module's SQL-object User Stories (only content source)
      - workspace/old/{P}/.sys/proc-snapshot/{schema}.{proc}.sql # READ-ONLY, evidence resolution only
      - .sdd/python/sdd_reverse/feat.reverse.template.md
      - .sdd/python/sdd_reverse/language_signatures.yml
    writes:
      - workspace/feats/{n}-{Name}.md                            # the module business FEAT
      - workspace/us/{n}-{m}-{Name}.md                           # Edit-augment back-fill (Covers/Status/hash) — pont /sdd-full
    delegated_to:
      - .sdd/python/sdd_reverse_scripts/validate_reverse_feat.py    # deterministic gate (max 3 iters)
    forbidden_reads:
      - workspace/src/         # never the application code
      # NB: reads .sys/proc-snapshot/*.sql for EVIDENCE resolution only — never
      # re-analyses the body (altitude already lifted by reverse-sql-analyst) and
      # NEVER connects to the live DB (it is disconnected by this phase).

  # --- Phase 0 + spécialistes du reverse base de données (2026-08-26) --------
  # Le db-reverse passe de 2 agents (analyste generaliste + composeur opt-in) a
  # une Phase 0 obligatoire suivie de specialistes par famille d'objet SQL.
  # Chacun lit son CONTEXT PACK (slice deterministe) plutot que de fouiller le
  # projet : la regle d'isolation est redirigee, pas relachee.

  reverse-db-architect:
    model_tier: deep
    phase: "db-0b"
    optional: false             # Phase 0.B — obligatoire avant toute remontee en US
    available_from: v1.2.0      # 2026-08-26 — Database Architect (interpretation layer)
    reads:
      - workspace/old/{P}/.sys/db-context.json                   # facts + execution plan (digest only)
      - workspace/old/{P}/.sys/db-context/_overview.md           # orientation
      - workspace/old/{P}/.sys/db-context/tables/{table}.md      # PIVOT tables only (ContextDigestBudget)
    writes:
      - workspace/old/{P}/.sys/db-context.hypotheses.json        # hypotheses branch ONLY — never facts
    delegated_to:
      - .sdd/python/sdd_reverse_scripts/db_context_build.py      # 0.A facts + deterministic merge of 0.B
    forbidden_reads:
      - workspace/old/{P}/.sys/proc-snapshot/   # never an object body — wrong altitude
      - workspace/src/
      # Writes a SEPARATE file merged by script (same guard as db-schema.enrichment.json,
      # ADV-3): an agent cannot clobber the fact layer, by construction.

  reverse-sql-function-analyst:
    model_tier: balanced
    phase: "db-1"
    optional: true
    available_from: v1.2.0      # 2026-08-26 — functions specialist (side-effect-free calculation)
    reads:
      - workspace/old/{P}/.sys/db-context/packs/{schema}.{object}.md  # the sanctioned context slice
      - workspace/old/{P}/.sys/proc-snapshot/{schema}.{proc}.sql      # READ-ONLY own body
      - workspace/old/{P}/.sys/inventory.json                         # (n, m, usName) allocations
      - .sdd/python/sdd_reverse/us.proc.reverse.template.md
    writes:
      - workspace/us/{n}-{m}-{Name}.md                                # 1 function = 1 user story
    forbidden_reads:
      - workspace/src/

  reverse-sql-view-analyst:
    model_tier: balanced
    phase: "db-1"
    optional: true
    available_from: v1.2.0      # 2026-08-26 — views specialist (projection / reporting)
    reads:
      - workspace/old/{P}/.sys/db-context/packs/{schema}.{object}.md
      - workspace/old/{P}/.sys/proc-snapshot/{schema}.{proc}.sql
      - workspace/old/{P}/.sys/inventory.json
      - .sdd/python/sdd_reverse/us.proc.reverse.template.md
    writes:
      - workspace/us/{n}-{m}-{Name}.md                                # 1 view = 1 user story
    forbidden_reads:
      - workspace/src/

  reverse-sql-trigger-analyst:
    model_tier: deep
    phase: "db-1"
    optional: true
    available_from: v1.2.0      # 2026-08-26 — triggers specialist (event-driven invariants)
    reads:
      - workspace/old/{P}/.sys/db-context/packs/{schema}.{object}.md
      - workspace/old/{P}/.sys/proc-snapshot/{schema}.{proc}.sql
      - workspace/old/{P}/.sys/inventory.json
      - .sdd/python/sdd_reverse/us.proc.reverse.template.md
    writes:
      - workspace/us/{n}-{m}-{Name}.md                                # 1 trigger = 1 user story
    forbidden_reads:
      - workspace/src/
      # Never routed below `balanced`: a trigger is the business rule the
      # applications cannot see and cannot bypass.


commands:
  sdd-reverse-init:
    phase: 0
    spawns: []
  sdd-reverse-inventory:
    phase: 1
    spawns: [reverse-inventory]
  sdd-reverse-audit:
    phase: 2
    spawns: [reverse-tech-auditor]
    available_from: v0.2.0   # V2 — implemented
  sdd-reverse-analyze:
    phase: 3a
    spawns: [reverse-tech-analyst]
    available_from: v0.7.0   # ADR governance-major-reverse-spec-ladder — barreau 3a
  sdd-reverse-stories:
    phase: 3b
    spawns: [reverse-us-writer]
    available_from: v0.7.0   # ADR governance-major-reverse-spec-ladder — barreau 3b
  sdd-reverse-feat:
    phase: 3c
    spawns: [reverse-feat-composer]
    available_from: v0.7.0   # ADR governance-major-reverse-spec-ladder — barreau 3c
  sdd-reverse:
    phase: 3
    spawns: []                  # ADR reverse-spec-ladder : séquenceur de /sdd-reverse-analyze (3a) + /sdd-reverse-stories (3b) + /sdd-reverse-feat (3c), ne spawn AUCUN agent (no-spawn §9)
  sdd-reverse-crosscut:
    phase: "3-bis"
    spawns: []                  # deterministic script, no agent (L3)
    available_from: v0.5.0
  sdd-reverse-ui:
    phase: 4
    spawns: [reverse-ui-extractor]
    available_from: v0.2.0   # V2 — implemented
  sdd-reverse-full:
    phase: "1-4"
    spawns: []                  # sequences commands, NOT agents (no-spawn rule §9 rules/reverse-engineering.md)
    available_from: v0.2.0   # V2 — implemented
  sdd-reverse-status:
    phase: any
    spawns: []
    available_from: v0.2.0   # V2 — implemented (deterministic, no agent)
  sdd-reverse-review:
    phase: "3.6"
    spawns: [reverse-completeness-reviewer]
    available_from: v0.6.0   # audit M11 2026-06-10 — wrapper so /sdd-reverse-full stays no-spawn
  sdd-reverse-synth:
    phase: "3.7"
    spawns: []                  # synthesis layer — deterministic, no agent (read-only over .sys artefacts)
    available_from: v0.8.0   # reverse synthesis layer (C4 + ERD + soul) — additive, never touches the ladder/FEAT
  sdd-reverse-paradigm:
    phase: "2.7"
    spawns: [reverse-paradigm-advisor]
    available_from: v0.9.0   # emprunt Reversa — paradigm gap + curation (informational, never destructive)
  sdd-reverse-parity:
    phase: "3.8"
    spawns: [reverse-parity-inspector]
    available_from: v0.9.0   # emprunt Reversa — Gherkin behavioral parity specs (informational)
  sdd-reverse-questions:
    phase: "3.9"
    spawns: [reverse-clarifier]
    available_from: v0.9.0   # emprunt Reversa — structured human validation loop (generate / --ingest)
  sdd-db-reverse-full:
    phase: "db-reverse"
    spawns: [reverse-sql-analyst]
    available_from: v1.0.0   # stored-procedure reverse — all routines (read-only DB → US/FEAT)
  sdd-db-reverse:
    phase: "db-reverse"
    spawns: [reverse-sql-analyst]
    available_from: v1.0.0   # stored-procedure reverse — single routine


scripts_v2:
  reverse_audit:
    path: .sdd/python/sdd_reverse_scripts/reverse_audit.py
    cli: python .sdd/python/sdd_reverse_scripts/reverse_audit.py --project <PATH> [--force-enrichment-on E.f] [--json]
  reverse_status:
    path: .sdd/python/sdd_reverse_scripts/reverse_status.py
    cli: python .sdd/python/sdd_reverse_scripts/reverse_status.py [--project P] [--json]
  reverse_smoke:
    path: .sdd/python/sdd_reverse_scripts/reverse_smoke.py
    cli: python .sdd/python/sdd_reverse_scripts/reverse_smoke.py [--json]
  merge_db_schema:
    path: .sdd/python/sdd_reverse/merge_db_schema.py
    cli: python .sdd/python/sdd_reverse/merge_db_schema.py --base <BASE> --enrichment <ENR> --output <OUT> [--force-enrichment-on E.f]


scripts:
  reverse_inventory:
    path: .sdd/python/sdd_reverse_scripts/reverse_inventory.py
    cli: python .sdd/python/sdd_reverse_scripts/reverse_inventory.py --project <PATH> [--use-cache] [--json]
  validate_reverse_feat:
    path: .sdd/python/sdd_reverse_scripts/validate_reverse_feat.py
    cli: python .sdd/python/sdd_reverse_scripts/validate_reverse_feat.py --feat-path <PATH> [--json]
  check_reverse_feat_for_full:
    path: .sdd/python/sdd_reverse_scripts/check_reverse_feat_for_full.py
    cli: python .sdd/python/sdd_reverse_scripts/check_reverse_feat_for_full.py --feat-path <GLOB> [--allow-reverse-low] [--json]
  generate_crosscutting_feats:                 # L3 — transversal FEATs (libs + DB)
    path: .sdd/python/sdd_reverse_scripts/generate_crosscutting_feats.py
    cli: python .sdd/python/sdd_reverse_scripts/generate_crosscutting_feats.py --project <PATH> [--feats-dir DIR] [--json]
  preallocate_feats:                           # L5 — deterministic (n,Name) pre-allocation
    path: .sdd/python/sdd_reverse_scripts/preallocate_feats.py
    cli: python .sdd/python/sdd_reverse_scripts/preallocate_feats.py --project <PATH> [--feats-dir DIR] [--json]
  check_feat_completeness:                     # L5 — back-side completeness gap engine
    path: .sdd/python/sdd_reverse_scripts/check_feat_completeness.py
    cli: python .sdd/python/sdd_reverse_scripts/check_feat_completeness.py --project <PATH> (--unit U-N | --feat-path P) [--json]
  check_ladder_traceability:                   # ADR reverse-spec-ladder — D3 fil FEAT→US→task→evidence (informational)
    path: .sdd/python/sdd_reverse_scripts/check_ladder_traceability.py
    cli: python .sdd/python/sdd_reverse_scripts/check_ladder_traceability.py (--project <PATH> --unit U-N | --feat-path P) [--json]
  update_extraction_cache:                     # C4 audit 2026-06-10 — L5 cache wiring (--check orchestrator / --save extractor)
    path: .sdd/python/sdd_reverse_scripts/update_extraction_cache.py
    cli: python .sdd/python/sdd_reverse_scripts/update_extraction_cache.py --project <PATH> --unit U-N (--check | --save --n N --name NAME) [--json]
  reverse_synth:                               # Phase 3.7 — synthesis layer (C4 + ERD + soul), deterministic, read-only, writes .sys/synthesis/
    path: .sdd/python/sdd_reverse_scripts/reverse_synth.py
    cli: python .sdd/python/sdd_reverse_scripts/reverse_synth.py --project <PATH> [--doc-level essentiel|complet|detaille] [--only c4,erd,soul] [--json]
  validate_parity_features:                    # Phase 3.8 — deterministic Gherkin parity gate (structure blocking-WARN, coverage informational)
    path: .sdd/python/sdd_reverse_scripts/validate_parity_features.py
    cli: python .sdd/python/sdd_reverse_scripts/validate_parity_features.py --feat-path <PATH> --parity-dir <DIR> [--json]
  reverse_proc_introspect:                     # db-reverse Phase 1 — live READ-ONLY introspection (SELECT-only, readonly_guard)
    path: .sdd/python/sdd_reverse_scripts/reverse_proc_introspect.py
    cli: python .sdd/python/sdd_reverse_scripts/reverse_proc_introspect.py (--full | --proc NAME | --from-introspection P) [--project DB] [--stack PATH] [--json]
  build_proc_us:                               # db-reverse routing — deterministic 0-token US for simple procs, needs_llm list for complex
    path: .sdd/python/sdd_reverse_scripts/build_proc_us.py
    cli: python .sdd/python/sdd_reverse_scripts/build_proc_us.py --project DB (--unit U-N | --all) [--dry-run] [--workspace DIR] [--json]
  build_proc_feats:                            # db-reverse rung 2 — deterministic module FEAT assembler (US → FEAT, no body re-read)
    path: .sdd/python/sdd_reverse_scripts/build_proc_feats.py
    cli: python .sdd/python/sdd_reverse_scripts/build_proc_feats.py --project DB (--unit U-N | --all) [--workspace DIR] [--json]


# Invariants reverse (V2 — to be hoisted in INVARIANTS.reverse.yml)
invariants_lite:
  - id: reverse-isolation
    description: "sdd_reverse/ MUST NOT import from sdd_lib, sdd_scripts, sdd_admin, sdd_hooks (D4 strict)."
  - id: reverse-loader-autonomous
