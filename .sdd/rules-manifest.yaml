# Manifest neutre des RÈGLES (Phase 2 multi-harness — surface identité Claude)
#
# Les 12 rules sont du markdown pur harness-neutre. Le foyer neutre ne
# duplique PAS leur contenu : chaque entrée porte un `body_source` pointant
# vers le fichier vivant `.sdd/rules/*.md` (lecture seule), même patron
# que les pivots agents/commandes/entrypoint. La régénération Claude est une
# IDENTITÉ (normalisation BOM + CRLF/CR -> LF uniquement) — golden test
# byte-identique.
#
# scope:
#   universal    — chargée par TOUT agent (contrat inconditionnel, pas de
#                  frontmatter `paths:`). 1 rule : output-protocol (qui porte
#                  aussi le noyau universel error-classification §7.3/§7.5 —
#                  TOK-C2, audit tokens 2026-08-30).
#   path-scoped  — auto-injectée seulement au contact de fichiers de son
#                  périmètre (frontmatter `paths:`, mécanisme natif Claude
#                  Code). 11 rules. TOK-C1 (CLAUDE.md §5) + TOK-C2 :
#                  error-classification est passée path-scoped (digests par
#                  agent = canal nominal) ; build-and-loop et
#                  dev-shared-preflight gardent une clé `paths:` réduite à
#                  leur propre fichier (auto-injection pipeline retirée — les
#                  consommateurs les lisent explicitement en STEP contexte).
#
# harness_mapping — comment chaque harnais consomme la couche rules :
#   claude-code : fichiers `.sdd/rules/*.md` (path-scoped natif). IDENTITÉ.
#   codex       : PAS de mécanisme path-scoped. La rule universelle est
#                 inlinée dans AGENTS.md ; les 11 path-scoped sont référencées
#                 par pointeur (chargement paresseux non disponible -> l'agent
#                 les Read explicitement, comme aujourd'hui en STEP contexte).
#   gemini-cli  : idem codex (inline universelle dans GEMINI.md + pointeurs).
#
# NOTE — la transpilation Codex/Gemini de la couche rules n'est PAS encore
# câblée (comme les couches agents/commandes) : `emit_rules` lève
# NotImplementedError pour ces harnais. Seul claude-code est en mode identité
# Phase 2.

schema: sdd.rules-manifest/v1

harness_mapping:
  claude-code: path-scoped-files
  codex: inline-universal-plus-pointers
  gemini-cli: inline-universal-plus-pointers

rules:
  - name: auditor-coordination
    body_source: .sdd/rules/auditor-coordination.md
    scope: path-scoped
  - name: auditor-orchestration
    body_source: .sdd/rules/auditor-orchestration.md
    scope: path-scoped
  - name: build-and-loop
    body_source: .sdd/rules/build-and-loop.md
    scope: path-scoped
  - name: db-reverse-tsql
    body_source: .sdd/rules/db-reverse-tsql.md
    scope: path-scoped
  - name: dev-shared-preflight
    body_source: .sdd/rules/dev-shared-preflight.md
    scope: path-scoped
  - name: error-classification-legacy
    body_source: .sdd/rules/error-classification-legacy.md
    scope: path-scoped
  - name: error-classification
    body_source: .sdd/rules/error-classification.md
    scope: path-scoped
  - name: library-and-stack
    body_source: .sdd/rules/library-and-stack.md
    scope: path-scoped
  - name: output-protocol
    body_source: .sdd/rules/output-protocol.md
    scope: universal
  - name: ownership
    body_source: .sdd/rules/ownership.md
    scope: path-scoped
  - name: quality
    body_source: .sdd/rules/quality.md
    scope: path-scoped
  - name: reverse-engineering
    body_source: .sdd/rules/reverse-engineering.md
    scope: path-scoped
