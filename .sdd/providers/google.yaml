# .sdd/providers/google.yaml — Provider qualifié Google Gemini
schema: sdd.provider/v1
name: google
endpoint_kind: native            # API Gemini native (Gemini CLI / Antigravity)
base_url_env: GOOGLE_GEMINI_BASE_URL  # défaut SDK : https://generativelanguage.googleapis.com
auth_env: GEMINI_API_KEY
tier_map:                        # Mapping qualifié par tiers
  deep: gemini-2.5-pro
  balanced: gemini-2.5-flash
  fast: gemini-2.5-flash-lite
context_window:
  deep: 1000000
  balanced: 1000000
  fast: 1000000
capabilities:
  structured_output_fidelity: high        # validé via JSONSchema enforcement dans spawn_agent.py
  tool_calling: google-native
  prompt_caching: context-caching       # API différente — appliqué si provider=google
telemetry:
  # Audit R5 2026-07-26 — Google Gemini API retains prompts up to 55 days by
  # default on consumer projects. Vertex AI (Google Cloud) supports data-
  # residency + no-logging via project-level config. Consumed by
  # preflight_secret_scan hook.
  default_retention_days: 55           # Gemini API consumer default (2026-07)
  optout_available: true               # Vertex AI no-log flag OR consumer opt-out
  optout_mechanism: "Vertex AI project with `--no-training` OR consumer form ai.google.dev/data-controls"
  reference_url: "https://ai.google.dev/gemini-api/terms"
pricing:                 # USD per million tokens — Google Gemini public pricing (2026-07-26)
  # Placeholders — à valider au 1er conformance run (§10). Tarifs Google
  # publiés sur https://ai.google.dev/pricing. cache_read/cache_creation
  # placeholders (Gemini context-caching a une structure différente ; le
  # cost-cap runtime utilise input/output uniquement).
  gemini-2.5-pro:        {input: 1.25, output:  5.00, cache_read: 0.3125, cache_creation: 1.25}
  gemini-2.5-flash:      {input: 0.075, output: 0.30, cache_read: 0.01875, cache_creation: 0.075}
  gemini-2.5-flash-lite: {input: 0.0375, output: 0.15, cache_read: 0.009375, cache_creation: 0.0375}

