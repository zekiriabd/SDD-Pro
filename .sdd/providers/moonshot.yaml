tier_map:                        # défauts retenus 2026-07-24 (série K2 classique retirée 25/05/2026)
  deep: kimi-k3                  # défaut retenu — re-vérifier au câblage — thinking always-on
  balanced: kimi-k2.7-code      # défaut retenu — re-vérifier au câblage — coding-tuné
  fast: kimi-k2.5                # défaut retenu — re-vérifier au câblage
context_window:
  deep: 1000000                  # à confirmer
  balanced: 256000               # à confirmer
  fast: 128000                   # à confirmer
capabilities:
  structured_output_fidelity: unknown   # à mesurer au conformance run (§10) avant tout SLA
  tool_calling: anthropic-compat
  prompt_caching: none
# pricing absent → tout run cost-cappé émettra [TELEMETRY_UNAVAILABLE] (fail-open loggué)
