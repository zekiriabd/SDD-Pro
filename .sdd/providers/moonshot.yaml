# .sdd/providers/moonshot.yaml — Kimi (décision Tech Lead 2026-07-24 :
# IDs modèles + endpoints = défauts de travail RETENUS — re-vérifier au câblage Phase 2).
# Double exposition : Anthropic-compat (Claude Code) ET OpenAI-compat (Codex).
schema: sdd.provider/v1
name: moonshot
endpoint_kind: anthropic-compat  # principal (Claude Code) ; aussi openai-compat, cf. endpoints
endpoints:
  anthropic: https://api.moonshot.ai/anthropic   # défaut retenu — re-vérifier au câblage
  openai: https://api.moonshot.ai/v1             # défaut retenu — re-vérifier au câblage
base_url_env: ANTHROPIC_BASE_URL # sous Claude Code ; base_url config.toml sous Codex
auth_env: MOONSHOT_API_KEY
tier_map:                        # défauts retenus 2026-07-24 (série K2 classique retirée 25/05/2026)
  deep: kimi-k3                  # défaut retenu — re-vérifier au câblage — thinking always-on
  balanced: kimi-k2.7-code      # défaut retenu — re-vérifier au câblage — coding-tuné
  fast: kimi-k2.5                # défaut retenu — re-vérifier au câblage
context_window:
  deep: 1000000                  # à confirmer
  balanced: 256000               # à confirmer
  fast: 128000                   # à confirmer
capabilities:
  structured_output_fidelity: unknown   # à mesurer au conformance run (§10) avant tout SLA
  tool_calling: anthropic-compat
  prompt_caching: none
telemetry:
  # Audit R5 2026-07-26 — Moonshot (Kimi) retention policy is not publicly
  # documented at the time of writing. Absence of a no-log contract must
  # be treated as "unknown = assume retained". Consumed by
  # preflight_secret_scan (moonshot is flagged as leak-risk provider).
  default_retention_days: unknown
  optout_available: unknown
  optout_mechanism: "Undocumented — request from Moonshot support before sending secrets"
  reference_url: "https://platform.moonshot.ai/"
pricing:                 # USD per million tokens — défauts retenus 2026-07-26, valider au conformance run (§10)
  # Placeholders (Kimi K3 nouveau, tarifs officiels à re-vérifier au
  # câblage). Cache non-supporté (`prompt_caching: none`) — cache_read/
  # cache_creation valorisés = input (compat schema, pas de saving réel).
  kimi-k3:       {input: 0.60, output: 2.50, cache_read: 0.60, cache_creation: 0.60}
  kimi-k2.7-code: {input: 0.15, output: 2.00, cache_read: 0.15, cache_creation: 0.15}
  kimi-k2.5:     {input: 0.10, output: 0.50, cache_read: 0.10, cache_creation: 0.10}
