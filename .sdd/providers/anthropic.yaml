# .sdd/providers/anthropic.yaml — provider de référence (schéma plan §8.2)
schema: sdd.provider/v1
name: anthropic
endpoint_kind: native            # API Anthropic native (référence)
base_url_env: ANTHROPIC_BASE_URL # défaut SDK : https://api.anthropic.com
auth_env: ANTHROPIC_API_KEY
tier_map:
  deep: claude-opus-4-8
  balanced: claude-sonnet-4-6
  fast: claude-haiku-4-5
context_window:
  deep: 200000
  balanced: 200000
  fast: 200000
capabilities:
  structured_output_fidelity: unknown   # référence de facto — à formaliser au 1er conformance run (§10)
  tool_calling: native
  prompt_caching: anthropic-ephemeral
telemetry:
  # Audit R5 2026-07-26 — track how prompts (which may contain stack.md
  # secrets) are handled by the provider. Consumed by preflight_secret_scan.
  default_retention_days: 30           # Anthropic consumer/enterprise default (Trust Center 2026)
  optout_available: true               # Zero Data Retention (enterprise + special API keys)
  optout_mechanism: "Anthropic ZDR flag (enterprise / trust-center request)"
  reference_url: "https://trust.anthropic.com/"
pricing:                 # USD per million tokens — aligned with sdd_lib/pricing.py PRICING (2026-08-30)
  # SSoT machine : sdd_lib/pricing.py. Ce bloc miroir permet à
  # impact_report.py de valider `pricing_present=True` (évite le warning
  # [TELEMETRY_UNAVAILABLE] à chaque `harness_build`). Toute modification
  # doit être répercutée dans pricing.py + bump `PRICING_LAST_REVIEWED`.
  claude-opus-4-8:   {input:  5.00, output: 25.00, cache_read: 0.50, cache_creation:  6.25}
  claude-sonnet-4-6: {input:  3.00, output: 15.00, cache_read: 0.30, cache_creation:  3.75}
  claude-haiku-4-5:  {input:  1.00, output:  5.00, cache_read: 0.10, cache_creation:  1.25}
