# .sdd/providers/anthropic.yaml — provider de référence (schéma plan §8.2)
schema: sdd.provider/v1
name: anthropic
endpoint_kind: native            # API Anthropic native (référence)
base_url_env: ANTHROPIC_BASE_URL # défaut SDK : https://api.anthropic.com
auth_env: ANTHROPIC_API_KEY
tier_map:
  deep: claude-opus-4-8
  balanced: claude-sonnet-4-6
  fast: claude-haiku-4-5
