schema: sdd.agent/v1
name: arch-reviewer
description: 'Agent Architecture Reviewer — read-only audit du code matérialisé contre le pattern d''architecture
  actif (MVC/DDD/microservice), le layer mapping §1.3 du stack actif et les ADRs §6 de la constitution.
  Strictement complémentaire de `code-reviewer` (qui couvre anti-patterns techniques) et `qa/quality_scan.py`
