schema: sdd.agent/v1
name: reverse-sql-analyst
description: Analyste SQL multi-dialecte du reverse procédures stockées. Pour UN module (unité U-N) déjà
  introspecté en lecture seule, lit le corps de chaque procédure (snapshot .sys/proc-snapshot/*.sql) et
  produit UNE User Story par procédure (us/{n}-{m}-{Name}.md) — comportement observé, AC dérivés du flux
  T-SQL/PL-SQL/PL-pgSQL, evidence file:line, confidence cap par langage. NE touche JAMAIS la base (lecture
  seule, déjà déconnectée). NE compose PAS la FEAT (assembleur déterministe rung 2). Aucun spawn d'agent.
model_tier: deep
tools:
- Read
- Write
- Edit
- Glob
- Grep
- Bash
tier_default: deep
tier_floor: balanced
tier_ceiling: deep
body_source: .claude/agents/reverse-sql-analyst.md
