schema: sdd.agent/v1
name: security-reviewer
description: 'Agent Security Reviewer — scan déterministe + Sonnet du code généré contre OWASP Top 10
  2021 (secrets hardcoded, injections SQL/cmd, XSS, broken authz/authn, crypto faible, CORS permissif,
  cookies insecure, headers manquants, logging secrets, stack traces exposées). Strictement read-only
