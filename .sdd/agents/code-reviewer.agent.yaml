schema: sdd.agent/v1
name: code-reviewer
description: Agent Code Reviewer — review du diff post-dev backend + frontend pour une FEAT, ciblé sur
  les anti-patterns spécifiques au stack, layer violations résiduelles, contract drift front↔back, et
  smells classiques. Complémentaire de `qa` (qui fait tests + coverage + quality_scan.py déterministe),
  focus sur ce qui exige du raisonnement cross-fichier. Produit `code-review.{md,json}` avec verdict 🟢/🟡/🔴
