schema: sdd.agent/v1
name: dev-frontend
description: Agent Dev-Frontend — pour UNE US donnée, lit l'US (workspace/us/{n}-{m}-{Name}.md) + le mockup
  HTML statique (workspace/ui/{n}-{m}-{Name}.html) + les stacks frontend/ui actifs, planifie inline les
  fichiers client à matérialiser, et génère le code (Pages, Components, Layouts, theme.css, bootstrap
