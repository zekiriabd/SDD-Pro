  - id: context-pack
    module: .sdd/python/sdd_lib/context_pack.py
    symbol: context_pack
    status: integrated
    owner: sdd_lib
    callers:
      - .sdd/python/sdd_scripts/build_context_pack.py
      - .sdd/python/sdd_hooks/preflight_agent_budget.py
