# SDD_Pro INTEGRATION Registry — audit correction #2 (2026-08-28)
#
# ============================================================================
# Pourquoi ce fichier existe
# ============================================================================
#
# L'audit du 2026-08-28 a établi que le défaut structurel dominant du
# framework n'est pas la qualité de ses composants déterministes, mais leur
# CHAÎNAGE : plusieurs briques sont implémentées, testées, documentées — et
# n'ont aucun appelant. Le motif se répète parce que celui qui devrait les
# appeler est un LLM qui lit du Markdown, et qu'un fichier Markdown n'appelle
# rien.
#
# `INVARIANTS.yml` répond à la question « ce contrat a-t-il un enforcer ? ».
# CE fichier répond à la question suivante, qui n'était posée nulle part :
#
#     « ce composant est-il réellement APPELÉ, et par qui ? »
#
# ============================================================================
# Le contrat (durcissement de la définition de « fait »)
# ============================================================================
#
# Un composant porteur du framework n'est plus considéré comme livré à
#
#     implemented + unit-tested
#
# mais à
#
#     implemented + integrated + exercised + observable
#
#   implemented  le module existe et fait ce qu'il annonce
#   integrated   un appelant réel le déclenche (commande, hook, autre script)
#                — pas « un agent est censé l'invoquer »
#   exercised    un test parcourt le chemin APPELANT → composant
#   observable   après un run, un humain peut lire une trace de son passage
#
# ============================================================================
# Statuts
# ============================================================================
#
#   integrated       les 4 propriétés sont vraies. État cible.
#   advisory         le composant tourne, mais rien ne consomme sa décision.
#                    Coût payé, valeur non perçue. Dette réelle.
#   orphan           aucun appelant. Code mort de fait.
#   harness-blocked  ne PEUT pas être câblé dans le harnais courant, par
#                    construction. Pas de la dette : une limite à documenter,
#                    et à ne pas confondre avec un oubli.
#
# ============================================================================
# Mécanisme de cliquet (le point important)
# ============================================================================
#
# `tests/test_integration_registry.py` échoue si :
#   - un `module:` déclaré n'existe pas sur disque ;
#   - un `callers:` déclaré n'existe pas, OU ne référence pas textuellement
#     le composant (le lien déclaré est vérifié, pas cru) ;
#   - un composant `integrated` n'a pas d'appelant, de test d'intégration
#     existant, et de moyen d'observation ;
#   - un composant `advisory` / `orphan` / `harness-blocked` n'a pas de
#     `reason` et d'`owner` ;
#   - le nombre de composants non-`integrated` DÉPASSE `debt_ceiling`.
#
# Ce dernier point est le cliquet : la dette peut décroître, jamais croître.
# Ajouter une brique non câblée exige de baisser le plafond ailleurs, ou de
# l'assumer explicitement en modifiant ce fichier — donc en le rendant visible
# en revue de code.
#
# ============================================================================

schema_version: 1
generated_at: "2026-08-28"
audit_ref: "audit-2026-08-28 correction #2 (composants non câblés)"

contract:
  - implemented
  - integrated
  - exercised
  - observable

# Plafond de dette : nombre maximum de composants déclarés ci-dessous dont le
# statut n'est pas `integrated`. Baisser cette valeur à chaque câblage ;
# l'augmenter exige une justification en revue.
#
# 2026-08-28 état initial : 7 (2 advisory + 3 orphan + 2 harness-blocked)
# 2026-08-28 après le lot de correction : 8 (+1 advisory `context-pack`, dont
#   la consommation par les prompts reste à câbler — cf. son `exit_plan`).
#   Le plafond MONTE ici, et c'est le comportement voulu du cliquet : ajouter
#   une brique non consommée doit se voir en revue, pas se dissoudre dans un
#   commit. Redescendre à 7 est la définition de « fini » pour la correction #4.
# 2026-08-28 lot 5 : 7 (`wave-barrier` orphan → integrated, P0-4 fermé).
#   Première baisse du plafond. C'est le seul sens dans lequel il doit bouger
#   sans discussion.
# 2026-08-28 lot 4 : 6 (`context-pack` advisory → integrated, P0-1 fermé).
#   Reste : 2 advisory (complexity-router, pipeline-planner — tous deux en
#   attente du Runner), 2 orphan (build-loop-trace, libname-lock), 2
#   harness-blocked (prompt-cache-manifest, spawn-agent).
debt_ceiling: 6

