      spawn (reconstruit seulement si l'empreinte de ses sources a bougé)
    output: "pack Markdown borné + manifeste de ce qui a été retiré"
    integration_test: .sdd/python/tests/test_context_pack.py
    observability: "WARN PACK_PROJECTION dans le rapport de context_budget"
    note: >-
      Ferme le P0-1. `arch` lit désormais son pack au lieu des 8 stacks actifs :
      `loader.yml` déclare `workspace/.sys/.context/packs/arch.md` dans ses
      `reads:` et les stacks dans un bloc `pack_sources:` distinct (un pack ne
      peut pas être sa propre source). Mesuré sur le dépôt : la gate de budget
      passait de 188 034 o / exit 1 à 160 645 o / exit 0.

      La contrepartie est le point important : un pack ABSENT pèse 0 octet et
      aurait produit un vert éclatant sur un agent privé de contexte de stack ;
      un pack PÉRIMÉ aurait nourri l'agent d'un stack d'hier. `context_budget`
      émet donc `[PACK_UNUSABLE]` — une ERREUR, pas un avertissement — dès que
      le pack déclaré est absent ou que l'empreinte de ses sources a changé.
      Le gain de contexte est payé par une gate qui refuse bruyamment un pack
      douteux au lieu de laisser passer un silence.

      Reste hors périmètre de ce lot : les 3 reviewers (gain projeté -16 à
      -21,5 %) et `constitutioner`. Leur budget est de 4 MB, donc leur gate ne
      se déclenche jamais — le gain y serait réel en tokens mais invisible en
      contrôle. À basculer sur le même patron, une fois celui-ci éprouvé sur
      un run réel.
    debt_ref: audit-2026-08-28 P0-1 / correction #4

