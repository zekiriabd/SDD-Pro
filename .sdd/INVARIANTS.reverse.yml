# INVARIANTS.reverse.yml — Load-bearing contracts of the reverse workflow.
#
# ADV-7 closure (v0.4.0 → V2 implementation). Mirror format of INVARIANTS.yml
# but isolated (D4 strict isolation). The standard test_invariants_manifest.py
# does NOT pick this file up — reverse_smoke.py is the enforcer.
#
# Per design doc §15.1.
#
# Each invariant declares:
#   id          — kebab-case identifier (matches reverse_smoke.py check name)
#   description — what is being enforced (1-2 sentences)
#   enforcer    — Python file (relative to repo root) that implements the check
#   class       — error class emitted on violation (cf. rules/reverse-engineering.md §6)

schemaVersion: 1
manifestType: reverse-engineering-invariants

invariants:

  - id: reverse-isolation-no-cross-imports
    description: |
      sdd_reverse/ modules MUST NOT import from sdd_lib, sdd_scripts, sdd_admin,
      sdd_hooks. D4 strict isolation. Helpers are duplicated locally
      (atomic_write_local.py, file_locks_local.py) — parity validated separately.
    enforcer: .sdd/python/sdd_reverse_scripts/reverse_smoke.py
    class: REVERSE_ISOLATION_VIOLATION

  - id: reverse-loader-autonomous
    description: |
      loader.reverse.yml MUST be referenced ONLY by reverse commands (frontmatter
      `loader:` field) and the starting-a-reverse-eng skill. NEVER by loader.yml.
    enforcer: .sdd/python/sdd_reverse_scripts/reverse_smoke.py
    class: REVERSE_ISOLATION_VIOLATION

  - id: reverse-evidence-required
    description: |
      Every SFD/FD/BR/AC in a reverse FEAT (generated-by: sdd-reverse) MUST
      carry <!-- evidence: path:Lstart-Lend --> in the same paragraph. Items
      without evidence MUST be rejected by the agent (never written). Enforced
      structurally by validate_reverse_feat.py.
    enforcer: .sdd/python/sdd_reverse_scripts/validate_reverse_feat.py
    class: REVERSE_EVIDENCE_MISSING

  - id: reverse-confidence-enum-strict
    description: |
      The `confidence` value (in frontmatter AND in <!-- confidence: ... -->
      comments) MUST be one of {high, medium, low}. No medium-high, no other
      values. Strict enum gate enforced by validate_reverse_feat.py.
    enforcer: .sdd/python/sdd_reverse_scripts/validate_reverse_feat.py
    class: REVERSE_GATE_DRIFT

  - id: reverse-gate-comment-sync
    description: |
      The <!-- REVERSE-GATE: confidence=X ; allow-sdd-full=Y --> comment MUST
      match the frontmatter.confidence. Desync → [REVERSE_GATE_DRIFT] (ADV-22).
    enforcer: .sdd/python/sdd_reverse_scripts/validate_reverse_feat.py
    class: REVERSE_GATE_DRIFT

  - id: reverse-lock-format-valid
    description: |
      The workspace/feats/.alloc.lock file MUST contain JSON with keys
      {agent_id, pid, ts_unix, host}. Format invariant ADV-2/ADV-10 — pid check
      is opportunistic (psutil optional), TTL is the authority. TTL is
      parameterized per phase (audit C5 2026-06-09) : 1800s for Phase 3
      extraction, 60s for preallocation/crosscut, 30s = bare helper default.
    enforcer: .sdd/python/sdd_reverse_scripts/reverse_smoke.py
    class: REVERSE_LOCK_HELD

  - id: reverse-inventory-schema-v1
    description: |
      All inventory.json files under workspace/old/*/.sys/ SHOULD have
      schemaVersion == 1 AND _allocatedNames + _featAllocations present
      (even as empty dicts). ADV-23 closure — refresh forced via
      --use-cache gate otherwise.
      Severity: WARN (NOT FAIL). [REVERSE_INVENTORY_SCHEMA_STALE] is
      INFO/WARN in rules/reverse-engineering.md §6 — a stale/pre-v0.4.0 cache
      triggers a forced refresh, it is not a hard contract breach. The
      reverse_smoke.check_inventory_schema_v1 runtime returns WARN; this
      manifest is aligned to the code (audit 2026-06-11 MA-8), not vice versa.
    severity: WARN
    enforcer: .sdd/python/sdd_reverse_scripts/reverse_smoke.py
    class: REVERSE_INVENTORY_SCHEMA_STALE

  - id: reverse-db-schema-enrichment-separate
    description: |
      Phase 2 (reverse-tech-auditor) MUST write to db-schema.enrichment.json
      (separate file), NEVER to db-schema.json directly. ADV-3 + ADV-17.
      Union performed by deterministic merge_db_schema.py.
    enforcer: .sdd/python/sdd_reverse_scripts/reverse_smoke.py
    class: REVERSE_ENRICHMENT_INVALID

  - id: reverse-no-spawn-of-agents
    description: |
      Reverse agents MUST NOT spawn other agents. /sdd-reverse-full is a
      command sequencer, NOT an agent (§9 rules/reverse-engineering.md).
    enforcer: .sdd/python/sdd_reverse_scripts/reverse_smoke.py
    class: (informational)

  - id: reverse-no-dead-code
    description: |
      ADR governance-major-reverse-spec-ladder D2. The LIVE wiring of
      loader.reverse.yml has no dead reference : every agent in a command
      `spawns:` has a prompt .md on disk ; every `agents:` block has a .md ;
      every reverse-*.md prompt has an `agents:` block. Removing
      reverse-functional-extractor (decommissioned) while a command still
      spawned it would FAIL. Prose mentions in docs/rules/CHANGELOG are NOT
      checked (historical references are legitimate).
      Audit 2026-08-29 (m1) — the check was named "no-dead-code" but only
      inspected loader<->prompt wiring, never Python: orphan scripts under
      sdd_reverse_scripts/ kept it green. It now also reports scripts with
      zero referrers under .sdd/, at WARN level (a script landed ahead of its
      caller is in-flight work, not a defect). M-1 follow-up (2026-08-30) —
      the scan is now transitive (fixed point): an orphan referenced solely
      by another orphan script is reported too (whole dead cluster).
    enforcer: .sdd/python/sdd_reverse_scripts/reverse_smoke.py
    class: (informational)

  - id: reverse-ladder-traceability
    description: |
      ADR governance-major-reverse-spec-ladder D3. The 3-rung chain
      FEAT item --covers--> US AC --covers--> task T-N --evidence--> file:line
      is verifiable. Gaps emit [REVERSE_LADDER_TRACEABILITY_GAP] (informational,
      never blocking, never filled by invention). Confidence is min-monotone
      ascending (3c <= 3b <= 3a).
    enforcer: .sdd/python/sdd_reverse_scripts/check_ladder_traceability.py
    class: REVERSE_LADDER_TRACEABILITY_GAP

  - id: reverse-template-isolated
    description: |
      Phase 3c (reverse-feat-composer) MUST read its template from
      .sdd/python/sdd_reverse/feat.reverse.template.md (local copy) ; les
      barreaux 3a/3b lisent analysis.reverse.template.md / us.reverse.template.md
      (mêmes copies locales isolées). Never fallback to .sdd/templates/*
      (standard SDD_Pro templates). ADV-9 closure.
    enforcer: .sdd/python/sdd_reverse_scripts/reverse_smoke.py
    class: REVERSE_TEMPLATE_MISSING

# L0-L6 deepening contracts (V2 2026-06-10 — informational, enforced by the
# dedicated pytest suites, NOT by the reverse_smoke 14-check registry which
# stays pinned to the invariants+drift_checks above. Count corrected 11→13
# audit 2026-06-11 MA-8, then 13→14 audit 2026-08-29 m4 (dialect read-only
# check) ; authoritative count = len(_ALL_CHECKS), pinned by
# tests/test_reverse_smoke_selfcheck.py).
  - id: reverse-db-context-facts-vs-hypotheses
    description: |
      Phase 0 of db-reverse separates what is PROVEN from what is INTERPRETED,
      and the separation is structural, not editorial. `db-context.json.facts`
      is produced only by the deterministic layer (db_context.build_facts, from
      db-introspection.json + db-schema.json, both extracted under
      readonly_guard); `db-context.json.hypotheses` is the only branch the
      Database Architect agent may write. merge_architect_output MUST drop any
      attempt by the agent to write facts or the execution plan. No LLM ever
      invents a table, a column, a relation or a CRUD operation.
      Structure only: no business data and no credentials reach the context.
    enforcer: .sdd/python/tests/test_db_context.py
    class: REVERSE_DB_CONTEXT_TAMPERED

  - id: reverse-db-context-versioned-and-diffable
    description: |
      The Database Context is a versioned SSoT: `contextVersion` is a sha256
      over the canonical facts, stable across runs and platforms. An unchanged
      database MUST reuse the architect's interpretation (no repeat LLM cost);
      a changed one MUST drop it rather than carry a stale reading, and say so
      via `reuse.staleHypotheses`. Two contexts are diffable
      (db_context.diff_contexts) and the diff names the objects whose User
      Stories must be re-derived (`reAnalysisRequired`).
    enforcer: .sdd/python/tests/test_db_context.py
    class: REVERSE_DB_CONTEXT_STALE

  - id: reverse-db-wave-ordering
    description: |
      The LLM rung of db-reverse is dispatched by dependency wave, never in
      inventory iteration order: every resolvable callee is analysed in a
      strictly earlier wave than its caller, so a caller receives the meaning
      of what it delegates to. Cycles are real in T-SQL: strongly connected
      components are condensed (Tarjan) and a component of size > 1 is planned
      as ONE unit. An unresolvable callee is reported, never invented as a
      graph node. Inside a wave, objects are independent and may run
      concurrently under MaxParallel.
    enforcer: .sdd/python/tests/test_db_context.py
    class: REVERSE_DB_WAVE_ORDER_VIOLATED

  - id: reverse-db-call-aware-routing
    description: |
      Composition is complexity. An object that calls another object is never
      routed "simple" (no template User Story for an orchestrator), and an
      object with an unresolved callee or inside a recursive component has its
      confidence capped at `medium` — which makes the REVERSE-GATE require a
      human review instead of passing a false green. confidence_with_graph only
      ever LOWERS confidence, preserving min-monotonicity up the ladder. A
      genuinely trivial leaf must stay `simple` (the 0-token path must not
      regress).
    enforcer: .sdd/python/tests/test_db_context.py
    class: REVERSE_DB_ROUTING_UNDERESTIMATED

  - id: reverse-db-context-slicing
    description: |
      No agent reads the whole Database Context. Each analysing agent receives a
      per-object context pack (db_context_slice.build_pack): its own body, the
      structure of the tables it touches, the already-written summaries of what
      it calls (depth-bounded), its callers, and the hypotheses concerning it.
      The isolation rule is redirected, not relaxed: the pack is the sanctioned
      channel for transitive context. A pack is budget-bounded and MUST declare
      every section it trimmed, so a truncated view lowers confidence knowingly.
    enforcer: .sdd/python/tests/test_db_context.py
    class: REVERSE_DB_PACK_TRUNCATED

deepening_contracts:

  - id: reverse-evidence-transitive-l0
    description: |
      units[].evidenceFiles MUST be enriched with the transitive class-reference
      chain (page→code-behind→service→repository), while the U-N fingerprint is
      computed from seedEvidenceFiles only (stability). units[].classes carries
      role-classified reached classes. (L0)
    enforcer: .sdd/python/tests/test_sdd_reverse_code_graph.py
    class: (informational)

  - id: reverse-deep-technical-extraction-l1
    description: |
      Phase 1 MUST emit data-access.json (inline SQL + stored proc defs/calls +
      params), config.json (connection strings, secrets masked), dependencies.json
      (NuGet/.csproj PackageReference + assembly refs + bin DLLs). (L1)
    enforcer: .sdd/python/tests/test_sdd_reverse_l1_extraction.py
    class: (informational)

  - id: reverse-code-driven-units-l2
    description: |
      Backend/API-only legacies (no UI page) MUST still yield functional units
      (controllers → kind:api, orphan modules → kind:module). Support-only types
      never form a unit alone. (L2)
    enforcer: .sdd/python/tests/test_sdd_reverse_l2_units.py
    class: (informational)

  - id: reverse-crosscutting-feats-l3
    description: |
      generate_crosscutting_feats.py MUST emit {n}-Libraries.md + {n}-Database.md
      that pass validate_reverse_feat.py, with idempotent allocation. (L3)
    enforcer: .sdd/python/tests/test_sdd_reverse_l3_crosscutting.py
    class: (informational)

  - id: reverse-preallocation-parallel-safe-l5
    description: |
      preallocate_feats.py fixes (n,Name) for all units deterministically; once
      pre-allocated, Phase 3 extraction is parallel-safe (agent skips inventory
      write-back). extraction-cache.json skips unchanged units. (L5, rules §8.2)
    enforcer: .sdd/python/tests/test_sdd_reverse_l5_industrial.py
    class: REVERSE_COMPLETENESS_GAP

  - id: reverse-db-readonly-proc
    description: |
      db-reverse (stored-procedure reverse) is strictly READ-ONLY against the
      live database. Every dialect catalog query MUST pass
      readonly_guard.is_readonly (SELECT-only, no DDL/DML/EXEC/INTO/batch), and
      db_introspect MUST call assert_readonly before executing any statement. It
      never runs procedures, never modifies structure or data. Mirrors the
      framework rule [DB_STRUCTURE_CHANGE_FORBIDDEN]. Defence-in-depth: a
      dedicated read-only DB login (GRANT VIEW DEFINITION + db_datareader) is
      recommended. Enforced by the offline test suite (no DB needed).
    enforcer: .sdd/python/tests/test_sdd_reverse_proc.py
    class: REVERSE_DB_READONLY_VIOLATION

  - id: reverse-proc-model-1proc-1us-1module-1feat
    description: |
      db-reverse mapping: 1 stored procedure = 1 User Story, 1 business module
      (cluster of procedures by object) = 1 FEAT. Ascending ladder (remontée):
      the FEAT is composed from the module's US (build_proc_feats) WITHOUT
      re-reading the T-SQL bodies. Confidence is min-monotone over the module's
      procedures. Generated FEATs pass validate_reverse_feat.py.
    enforcer: .sdd/python/tests/test_sdd_reverse_proc.py
    class: (informational)

  - id: reverse-roundtrip-parity-l6
    description: |
      After Phase 1 + cross-cutting, the reverse output MUST capture entities,
      deep repository class, inline SQL, stored procs (+params/OUTPUT), connection
      strings, libraries (NuGet + assembly), and class roles — the deterministic
      contract behind "legacy → specs → /sdd-full → equivalent app". (L6)
    enforcer: .sdd/python/tests/test_sdd_reverse_l6_roundtrip.py
    class: (informational)

# Drift detection (informational, V2 — see §15.1 design doc)
drift_checks:

  - id: validator-parity-drift
    description: |
      validate_reverse_feat.py SHOULD stay aligned with structural checks of
      validate_readiness.py. WARN if a check exists in standard but not in
      reverse (out-of-scope OK, but should be noticed).
    enforcer: .sdd/python/sdd_reverse_scripts/reverse_smoke.py
    class: REVERSE_VALIDATOR_DRIFT

  - id: helper-parity-drift
    description: |
      sdd_reverse/atomic_write_local.py + file_locks_local.py SHOULD stay
      semantically equivalent to sdd_lib/atomic_write.py + sdd_lib/file_locks.py.
      Compare hashes against _parity_snapshots.json — WARN if either upstream
      file changed (review needed).
    enforcer: .sdd/python/sdd_reverse_scripts/reverse_smoke.py
    class: REVERSE_HELPER_DRIFT
