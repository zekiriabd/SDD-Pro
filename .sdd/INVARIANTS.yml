  - id: tdd-test-first-no-prod-code-without-failing-test
    name: RED-GREEN-REFACTOR — NO production code without a failing test first
    description: |
      Emprunt direct Superpowers v5.1 (test-driven-development skill). Tout
      nouveau symbole de production (function/class/method/endpoint) sous
      `workspace/src/` doit avoir un test compagnon écrit AVANT le
      code. Le hook `enforce_tdd` détecte la création de symboles publics
      (regex .cs/.ts/.tsx/.py/.kt/.java) et flag si aucun fichier test
      n'existe sous *.Tests/, __tests__/, tests/, src/test/.

      Refactor (Edit sur code existant sans nouveau symbole) = allowed.
      Test files themselves = allowed. Framework code (.claude/) = allowed.
    severity: major
    enforcers:
      - .sdd/python/sdd_hooks/enforce_tdd.py  # PreToolUse Edit|Write|MultiEdit
      - .sdd/skills/test-driven-development/SKILL.md
    bypasses:
      - "Env: SDD_TDD_MODE=off (no enforcement)"
      - "Env: SDD_TDD_MODE=warn (default interactive : warn, no block)"
      - "Env: SDD_TDD_MODE=strict (default CI : exit 2 = block)"
      - "Env: SDD_DISABLE_TDD=1 (one-shot, audit-logged)"
    added: 2026-06-08
    audit_ref: P3-TDD (emprunt Superpowers v5.1)

  - id: harness-parity
    name: Façades .claude/, .codex/, .gemini/ = régénérations byte-identiques de .sdd/ HEAD
    description: |
      Le foyer neutre `.sdd/` est SSoT unique. Les façades (`.claude/agents+
      commands+rules+CLAUDE.md`, `.codex/prompts+AGENTS.md+config.toml`,
      `.gemini/commands+GEMINI.md+settings.json`) sont des artefacts
      régénérables par `.sdd/harness_build.py` — jamais édités à la main.
      Tout drift entre pivots `.sdd/` et sortie de `harness_build` sur HEAD
      = perte de contrôle multi-harness (une façade éditée directement
      dérive silencieusement du SSoT).

      Périmètre couvert par la parité byte-identique (recount audit 2026-08-29,
      ajout des 4 analystes SQL reverse le 2026-08-26) : agents (29), commandes
      (41), rules (12), CLAUDE.md +
      variantes memory par harnais (AGENTS.md / GEMINI.md). Les skills
      (`.sdd/skills/`, 13 SKILL.md) ne sont PAS transpilés par
      `harness_build.py` — sous Claude Code ils sont chargés directement
      depuis `.sdd/skills/` (dépendance auto-découverte par le harnais) ;
      sous Codex / Gemini / Antigravity ils sont **absents runtime** et
      leur substance doit être inlinée via prompts si l'agent en dépend.
      Cette omission de la parité byte-identique est intentionnelle
      (skills = enrichissement optionnel, non load-bearing pour le pipeline
      forward). Toute évolution vers une injection statique dans
      `AGENTS.md`/`GEMINI.md` doit ré-ouvrir cette invariant.

      Le golden test `test_harness_identity{,_commands}.py` compare
      sémantiquement la régénération à la façade vivante (post-normalisation
      BOM/CRLF). Un test dédié `test_harness_codex_gemini.py` vérifie que
      les 41 commandes transpilées ne contiennent aucun dead-link `.sdd/<x>`.

      Enforcement runtime : les 4 façades sont gitignorées (.gitignore),
      donc le SSoT ne peut PAS drifter via commit direct sur une façade.
      Enforcement CI : les 82 tests harness (test_harness_*.py) doivent
      passer avant merge — un pivot édité SANS régénération correspondante
      casse la parité et bloque le CI.
    severity: critical
    enforcers:
      - .sdd/python/tests/test_harness_identity.py  # golden agents pivots ↔ façades
      - .sdd/python/tests/test_harness_identity_commands.py  # golden commands
      - .sdd/python/tests/test_harness_codex_gemini.py  # zero dead-link + escape rules
      # Audit 2026-08-28 — les 3 enforcers ci-dessus ne comparaient les pivots
      # qu'à `.claude/` ; `.codex/` et `.gemini/` n'étaient confrontés à rien,
      # et avaient dérivé (`.codex/prompts/sdd-full.md` décrivait encore un
      # enforcer PowerShell remplacé par du Python depuis plusieurs versions).
      # Un invariant partiellement vérifié se comporte comme un invariant non
      # vérifié sur la part qu'il ne couvre pas. Ce test compare la façade
      # COMMITÉE à une régénération fraîche, pour les 3 harnais, agents et
      # rules inclus.
      - .sdd/python/tests/test_harness_facade_parity.py  # façade committée ↔ build frais (3 harnais)
      - .sdd/harness_build.py  # transpileur idempotent, garde `_ensure_under_build`
      - .gitignore  # façades .claude/{agents,commands,rules,CLAUDE.md}, .codex/, .gemini/
    bypasses:
      - "Env: SDD_ALLOW_UNTESTED_HARNESS=1 (audit-log, réservé bootstrap deploy)"
    added: 2026-07-26
    audit_ref: audit-2026-07-25 R12 (post-migration multi-harness gap closure)

  - id: token-usage-telemetry-wired
    name: record_token_usage.py must stay wired in settings.json (feeds cost-cap-per-run)
    description: |
      `preflight_cost_cap.py` (invariant `cost-cap-per-run`) decides whether to
      block further Agent spawns by summing rows in the `token_usage` table.
      Those rows are inserted exclusively by `record_token_usage.py`, wired as
      a PostToolUse + SubagentStop hook on the `Agent` matcher. Before this
      invariant, nothing detected the difference between "no cost yet" and
      "the hook stopped firing" — a silent de-wiring would let the cost cap
      run forever on stale/zero data with no alarm (audit 2026-08-29).
    severity: major
    enforcers:
      - .sdd/python/sdd_hooks/record_token_usage.py
      - .sdd/docs/gates-map.md  # §4 registers it; test_gates_map.py checks live wiring
      - .sdd/python/tests/test_gates_map.py  # test_hook_enforcers_still_wired_in_settings
    bypasses: []
    added: 2026-08-29
    audit_ref: audit-2026-08-29 (forward-pipeline review — orchestration/parallelism)
