# SDD_Pro v6.9.0 — Layered Project Config defaults
#
# This file is the **base layer** of the 3-level config hierarchy:
#   1. .claude/config.base.yml          (this file — framework defaults)
#   2. ~/.sdd/config.team.yml           (org/team policy, override)
#   3. workspace/input/stack/stack.md   (per-project ## Project Config, final override)
#
# Behavior: each layer merges into the next (project > team > base).
# Deep-merge semantics: scalars replaced, lists replaced (no concat).
#
# Backward compatibility:
#   - Scripts call read_layered_config() (new) OR read_project_config() (legacy).
#   - read_project_config() is unchanged — only parses stack.md, ignores this file.
#   - read_layered_config() reads all 3 layers; if this file is absent, falls
#     back to project-only (= behavior identical to read_project_config()).
#
# Security-down protection:
#   Project cannot relax team's policy on SecurityFailOn, A11yFailOn,
#   CodeReviewFailOn, PerfFailOn, SpecComplianceFailOn, CoverageMin.
#   Violation → [CONFIG_SECURITY_DOWNGRADE] ConfigError.

# --- QA & Coverage ---
QAMode: manual
CoverageMin: 80

# --- Pipeline parallelism ---
MaxParallel: 3
BuildLoopMaxIter: 3

# --- Auditor modes (v6.3.x + v6.4 + v6.5.2) ---
A11yMode: full
A11yFailOn: serious
CodeReviewMode: manual
CodeReviewFailOn: critical
SecurityMode: manual
SecurityFailOn: critical
SecurityThreatModelEnabled: true
SecurityScanEnabled: true
PerfMode: full
PerfFailOn: serious
SpecComplianceMode: manual
SpecComplianceFailOn: serious

# --- Plan Cache Strict (v6.2 introduced opt-in, v6.10.5 flipped default true) ---
# Rationale (audit 2026-05-19) :
#   - dev-*-strict (Sonnet 4.6) reads only plan v2 + Inline Digest at runtime,
#     bypassing stacks/CLAUDE.md/schema.json reads (~80 KB saved).
#   - Estimated ROI : ~-40 % tokens / FEAT, ~-7 $/FEAT for a 3-US fullstack feat.
#   - Safety net : validate_plan.py --strict returns exit 1 on plan v1 or
#     missing "## Inline Digest" → /dev-run STEP 6.a falls back AUTOMATICALLY
#     to dev-* (Opus 4.7). So enabling this flag is transparent — old plans
#     keep running on Opus, new plans (generated by /dev-plan v6.2+) get
#     the fast path.
#   - Revert : flip to false here OR override in workspace/input/stack/stack.md
#     ## Project Config (project layer wins).
PlanCacheStrict: true

# --- Gated workflow (backend-first) ---
GatedWorkflow: true
ApiGateRequired: true
ApiGateMinPerEndpoint: 2

# --- Plan review ---
PlanReviewDefault: true

# --- Checkpoint (v6.6.3) ---
CheckpointMode: "off"

# --- Token telemetry (v6.5.1) ---
# Note: env var SDD_TOKEN_USAGE_MODE takes precedence over this key.
# Setting here just documents the framework default ("off").
TokenUsageMode: "off"
