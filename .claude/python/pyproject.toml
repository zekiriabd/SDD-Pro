[project]
name = "sdd-pro-tools"
version = "0.1.0"
description = "SDD_Pro framework hooks and scripts (Python port for cross-platform support)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"
